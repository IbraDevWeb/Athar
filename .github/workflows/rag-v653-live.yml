name: Athar RAG V6.5.3 live production gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rag-v653-live.yml'
      - 'render.yaml'

concurrency:
  group: rag-v653-live-production-gate
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Wait for V6.5.3 semantic sidecar
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          url='https://athar-rag-semantic-ibradevweb.onrender.com/healthz'
          last=None
          for attempt in range(1,121):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Athar-V6.5.3-live'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      payload=json.load(response)
                  last=payload
                  print(f'semantic {attempt}/120:',payload,flush=True)
                  if (payload.get('ready') is True and
                      payload.get('engine')=='athar-v6.5.3-semantic-sidecar-sharded-f16' and
                      int(payload.get('ann_vectors') or 0)==574461):
                      print('PUBLIC V6.5.3 SEMANTIC SIDECAR: PASS')
                      break
              except Exception as exc:
                  last=repr(exc); print(f'semantic {attempt}/120 error:',exc,flush=True)
              time.sleep(20)
          else:
              raise SystemExit(f'V6.5.3 semantic sidecar unavailable: {last}')
          PY

      - name: Wait for V6.5.3 public server
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          url='https://athar-rag-ibradevweb.onrender.com/healthz'
          expected='athar-v6.5.3-remote-semantic-fusion'
          last=None
          for attempt in range(1,121):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Athar-V6.5.3-live'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      payload=json.load(response)
                  last=payload
                  print(f'main {attempt}/120:',payload,flush=True)
                  if payload.get('ok') and payload.get('engine')==expected:
                      print('PUBLIC V6.5.3 SERVER: PASS')
                      break
              except Exception as exc:
                  last=repr(exc); print(f'main {attempt}/120 error:',exc,flush=True)
              time.sleep(20)
          else:
              raise SystemExit(f'V6.5.3 public server unavailable: {last}')
          PY

      - name: Verify V6.5.3 remote semantic fusion
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request
          payload={'query':"Quelles sont les règles du tayammum lorsqu'une personne ne peut pas utiliser l'eau ?",'limit':8}
          req=urllib.request.Request(
              'https://athar-rag-ibradevweb.onrender.com/api/rag/v5/ask',
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type':'application/json','Origin':'https://ibradevweb.github.io','Cache-Control':'no-cache','User-Agent':'Athar-V6.5.3-live'},method='POST')
          with urllib.request.urlopen(req,timeout=120) as response:
              result=json.load(response); cors=response.headers.get('Access-Control-Allow-Origin')
          analysis=result.get('analysis') or {}; sources=result.get('sources') or []
          print(json.dumps({'engine':result.get('engine'),'count':len(sources),'remote_available':analysis.get('semantic_remote_available'),'remote_fallback':analysis.get('semantic_remote_fallback'),'semantic_candidates':analysis.get('semantic_candidate_count')},ensure_ascii=False,indent=2))
          assert cors=='https://ibradevweb.github.io',cors
          assert result.get('engine')=='athar-v6.5.3-remote-semantic-fusion',result
          assert analysis.get('semantic_remote_called') is True,analysis
          assert analysis.get('semantic_remote_available') is True,analysis
          assert analysis.get('semantic_remote_fallback') is False,analysis
          assert sources and len(sources)<=8,result
          for rank,source in enumerate(sources,1):
              assert source.get('citation_id')==f'S{rank}',source
              assert source.get('id') and source.get('book_id') and source.get('title'),source
          print('PUBLIC V6.5.3 REMOTE FUSION: PASS')
          PY

      - name: Verify V6.1 abstention remains authoritative
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request
          payload={'query':'Comment configurer Ethernet sur une station spatiale dans Sahih al-Bukhari ?','limit':8}
          req=urllib.request.Request('https://athar-rag-ibradevweb.onrender.com/api/rag/v5/ask',data=json.dumps(payload).encode('utf-8'),headers={'Content-Type':'application/json','Cache-Control':'no-cache','User-Agent':'Athar-V6.5.3-live'},method='POST')
          with urllib.request.urlopen(req,timeout=120) as response: result=json.load(response)
          analysis=result.get('analysis') or {}
          assert result.get('engine')=='athar-v6.5.3-remote-semantic-fusion',result
          assert not (result.get('sources') or []),result
          assert (result.get('answer') or {}).get('verdict')=='insufficient',result
          assert analysis.get('semantic_remote_called') is False,analysis
          print('PUBLIC V6.5.3 ABSTENTION: PASS')
          PY
