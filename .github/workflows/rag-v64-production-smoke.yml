name: Athar RAG V6.4 production smoke

on:
  workflow_run:
    workflows: ['Athar RAG V6.4 publish ANN release']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: rag-v64-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PYTHONPATH: rag
      ATHAR_QUERY_LLM_ENABLED: '0'
      GEMINI_API_KEY: ''
      FASTEMBED_CACHE_PATH: rag/data/fastembed-cache
      ATHAR_FASTEMBED_LOCAL_ONLY: '1'
      ATHAR_ANN_VERIFY_SHA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install V6.4 production dependencies
        run: python -m pip install -r rag/requirements-v64.txt

      - name: Compile V6.4 production layer
        run: >-
          python -m py_compile
          rag/cache_v63c_ann_release.py
          rag/cache_fastembed_model.py
          rag/v64_production.py
          rag/v64_tests.py
          rag/v64_production_smoke.py

      - name: Run reversible adapter tests
        run: python rag/v64_tests.py

      - name: Cache public ANN release
        run: >-
          python rag/cache_v63c_ann_release.py
          --corpus-manifest rag/corpus_release_v3.json
          --output-dir rag/data/v63c-ann

      - name: Cache query embedding model
        run: >-
          python rag/cache_fastembed_model.py
          --model sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
          --cache-dir rag/data/fastembed-cache

      - name: Generate fixed 200-case dataset
        run: python rag/benchmark_v61_dataset.py --output rag/data/benchmark-v61.json

      - name: Cache immutable corpus shards
        run: >-
          python rag/cache_hosted_corpus.py
          --manifest rag/corpus_release_v3.json
          --output-dir rag/data/v64-smoke-shards

      - name: Run full disk-view production smoke
        run: >-
          python rag/v64_production_smoke.py
          --dataset rag/data/benchmark-v61.json
          --manifest rag/corpus_release_v3.json
          --shard-dir rag/data/v64-smoke-shards
          --ann-manifest rag/data/v63c-ann/athar-v63c-global.ann.json
          --output-json rag/data/benchmark-v64-production-smoke.json
          --output-md rag/data/BENCHMARK_V64_PRODUCTION_SMOKE.md

      - name: Add smoke summary
        if: always()
        shell: bash
        run: |
          if [ -f rag/data/BENCHMARK_V64_PRODUCTION_SMOKE.md ]; then
            cat rag/data/BENCHMARK_V64_PRODUCTION_SMOKE.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload V6.4 production smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athar-rag-v64-production-smoke
          path: |
            rag/data/benchmark-v64-production-smoke.json
            rag/data/BENCHMARK_V64_PRODUCTION_SMOKE.md
          if-no-files-found: warn
          retention-days: 90
