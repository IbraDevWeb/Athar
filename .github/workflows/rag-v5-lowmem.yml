name: RAG V5 low-memory production test

on:
  push:
    branches: [main]
    paths:
      - 'rag/v5_server.py'
      - 'rag/v5_lowmem.py'
      - '.github/workflows/rag-v5-lowmem.yml'
  workflow_dispatch:

jobs:
  low-memory-real-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r rag/requirements.txt
      - name: Compile hosted server
        run: python -m py_compile rag/v5_engine.py rag/v5_lowmem.py rag/v5_server.py
      - name: Download published corpus
        run: python rag/cache_hosted_corpus.py --output rag/data/v5_lowmem_test.sqlite
      - name: Start low-memory server
        run: |
          ATHAR_DB_PATH=rag/data/v5_lowmem_test.sqlite python rag/v5_server.py --host 127.0.0.1 --port 8765 --api-only > /tmp/athar-v5.log 2>&1 &
          echo $! > /tmp/athar-v5.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/healthz >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
      - name: Hammer lightweight health check
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8765/healthz >/dev/null; done
      - name: Verify natural-language query and bounded candidates
        run: |
          python - <<'PY'
          import json, urllib.request
          body = json.dumps({'query':'prier à voix haute','limit':8,'madhhab':'','discipline':''}, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request('http://127.0.0.1:8765/api/rag/v4/ask', data=body, headers={'Content-Type':'application/json; charset=utf-8'}, method='POST')
          with urllib.request.urlopen(req, timeout=120) as r:
              payload = json.loads(r.read().decode('utf-8'))
          print(json.dumps({'engine': payload.get('engine'), 'runtime_profile': payload.get('runtime_profile'), 'count': payload.get('count'), 'analysis': payload.get('analysis'), 'titles': [s.get('title') for s in payload.get('sources', [])]}, ensure_ascii=False, indent=2))
          assert payload.get('engine') == 'rag-v5-hybrid-multilingual', payload
          assert payload.get('runtime_profile') == 'low-memory', payload
          assert payload.get('sources'), payload
          assert 'recitation_aloud' in payload.get('analysis', {}).get('concepts', []), payload
          assert payload.get('analysis', {}).get('candidate_count', 999) <= 72, payload
          PY
      - name: Check process memory
        run: |
          PID=$(cat /tmp/athar-v5.pid)
          RSS_KB=$(ps -o rss= -p "$PID" | tr -d ' ')
          echo "Athar V5 RSS: ${RSS_KB} KiB"
          test -n "$RSS_KB"
          test "$RSS_KB" -lt 400000
          tail -n 40 /tmp/athar-v5.log
      - name: Stop server
        if: always()
        run: kill $(cat /tmp/athar-v5.pid) 2>/dev/null || true
