name: RAG V5 live verification

on:
  push:
    branches: [main]
    paths:
      - 'rag/v5_*.py'
      - 'render.yaml'
      - '.github/workflows/rag-v5-live.yml'
  workflow_dispatch:

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for V5 engine on Render
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = 'https://athar-rag-ibradevweb.onrender.com/healthz'
          last = None
          for attempt in range(1, 61):
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','User-Agent':'Athar-V5-check'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = json.loads(r.read().decode('utf-8'))
                  last = payload
                  print('Attempt', attempt, payload)
                  if payload.get('ok') and payload.get('engine') == 'rag-v5-hybrid-multilingual' and payload.get('engine_version') == 5:
                      print('Public Render V5 health endpoint is ready')
                      raise SystemExit(0)
              except Exception as exc:
                  last = repr(exc)
                  print('Attempt', attempt, exc)
              time.sleep(20)
          raise SystemExit(f'V5 did not become live: {last}')
          PY

      - name: Wait for natural-language search endpoints
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request

          base = 'https://athar-rag-ibradevweb.onrender.com'
          queries = [
              'prier à voix haute',
              'dans quelles prières récite-t-on à voix haute ?',
              "est-ce qu'on prie à voix basse au dhuhr ?",
              'peut-on regrouper les prières en voyage ?',
          ]
          last = None
          for attempt in range(1, 31):
              try:
                  payloads = []
                  for query in queries:
                      url = base + '/api/rag/v5/search?' + urllib.parse.urlencode({'q': query, 'limit': 8})
                      req = urllib.request.Request(
                          url,
                          headers={
                              'Origin': 'https://ibradevweb.github.io',
                              'Accept': 'application/json',
                              'Cache-Control': 'no-cache',
                              'User-Agent': 'Athar-V5-check',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=120) as response:
                          payload = json.loads(response.read().decode('utf-8'))
                          cors = response.headers.get('Access-Control-Allow-Origin')
                      print(query, '=>', payload.get('count'), payload.get('analysis'), flush=True)
                      assert cors == 'https://ibradevweb.github.io', cors
                      assert payload.get('engine') == 'rag-v5-hybrid-multilingual', payload
                      assert payload.get('sources'), payload
                      payloads.append(payload)

                  first = payloads[0]
                  analysis = first.get('analysis') or {}
                  concepts = analysis.get('technical_concepts') or analysis.get('concepts') or []
                  assert 'recitation_aloud' in concepts, analysis
                  assert any('recitation_aloud' in (s.get('matched_concepts') or []) for s in first.get('sources') or []), first
                  print('PUBLIC RAG V5 NATURAL FRENCH RETRIEVAL: PASS')
                  raise SystemExit(0)
              except Exception as exc:
                  last = exc
                  print(f'Natural-search attempt {attempt}/30: {exc}', flush=True)
                  time.sleep(15)
          raise SystemExit(f'Natural-language search endpoints did not become stable: {last}')
          PY

      - name: Wait for eclipse Query Intelligence deployment
        run: |
          python - <<'PY'
          import json, time, unicodedata, urllib.parse, urllib.request

          base = 'https://athar-rag-ibradevweb.onrender.com'
          query = "Que dit le Muwatta sur la prière de l'éclipse ?"

          def norm(value):
              text = unicodedata.normalize('NFKD', str(value or ''))
              text = ''.join(ch for ch in text if not unicodedata.combining(ch))
              return ' '.join(text.casefold().replace('’', "'").split())

          last = None
          for attempt in range(1, 46):
              try:
                  url = base + '/api/rag/v5/search?' + urllib.parse.urlencode({'q': query, 'limit': 8})
                  req = urllib.request.Request(
                      url,
                      headers={
                          'Origin': 'https://ibradevweb.github.io',
                          'Accept': 'application/json',
                          'Cache-Control': 'no-cache',
                          'User-Agent': 'Athar-Eclipse-live-check',
                      },
                  )
                  with urllib.request.urlopen(req, timeout=120) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  last = payload
                  analysis = payload.get('analysis') or {}
                  sources = payload.get('sources') or []
                  intelligence = analysis.get('query_intelligence')
                  notions = analysis.get('notions') or []
                  routed = analysis.get('routed_book') or {}
                  print(
                      'Attempt', attempt,
                      'intelligence=', intelligence,
                      'notions=', notions,
                      'routed=', routed,
                      'top=', [(s.get('title'), s.get('chapter'), s.get('page'), s.get('matched_concepts')) for s in sources[:3]],
                      flush=True,
                  )

                  # Presence of these fields proves the new runtime, not merely an
                  # old healthy V5 process, has actually been deployed by Render.
                  if not isinstance(intelligence, dict) or 'used' not in intelligence:
                      raise RuntimeError('Query Intelligence runtime not deployed yet')
                  if not any('eclipse' in norm(item) for item in notions):
                      raise RuntimeError(f'eclipse notion missing: {notions}')
                  if 'muwatta' not in norm(routed.get('title')):
                      raise RuntimeError(f'Muwatta routing missing: {routed}')
                  if not sources:
                      raise RuntimeError('no eclipse evidence returned')
                  if 'muwatta' not in norm(sources[0].get('title')):
                      raise RuntimeError(f'top evidence is not Muwatta: {sources[0]}')
                  if not any('eclipse_prayer' in (source.get('matched_concepts') or []) for source in sources[:3]):
                      raise RuntimeError('eclipse-specific concept did not reach the evidence ranking')

                  print(
                      'PUBLIC ATHAR ECLIPSE QUERY: PASS —',
                      'Gemini used=' + str(bool(intelligence.get('used'))),
                      'fallback=' + str(intelligence.get('fallback')),
                      'top=' + str(sources[0].get('chapter') or sources[0].get('page')),
                  )
                  raise SystemExit(0)
              except Exception as exc:
                  last = exc
                  print(f'Attempt {attempt}/45: {exc}', flush=True)
                  time.sleep(20)
          raise SystemExit(f'Eclipse Query Intelligence did not become ready: {last}')
          PY
