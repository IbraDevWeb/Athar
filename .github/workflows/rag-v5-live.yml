name: RAG V5 live verification

on:
  push:
    branches: [main]
    paths:
      - 'rag/v5_*.py'
      - 'render.yaml'
      - '.github/workflows/rag-v5-live.yml'
  workflow_dispatch:

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for V5 engine on Render
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = 'https://athar-rag-ibradevweb.onrender.com/healthz'
          last = None
          for attempt in range(1, 61):
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','User-Agent':'Athar-V5-check'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = json.loads(r.read().decode('utf-8'))
                  last = payload
                  print('Attempt', attempt, payload)
                  if payload.get('ok') and payload.get('engine') == 'rag-v5-hybrid-multilingual' and payload.get('engine_version') == 5:
                      print('Public Render V5 is ready')
                      raise SystemExit(0)
              except Exception as exc:
                  last = repr(exc)
                  print('Attempt', attempt, exc)
              time.sleep(20)
          raise SystemExit(f'V5 did not become live: {last}')
          PY

      - name: Reproduce the user query against production
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base = 'https://athar-rag-ibradevweb.onrender.com'
          queries = [
              'prier à voix haute',
              'dans quelles prières récite-t-on à voix haute ?',
              "est-ce qu'on prie à voix basse au dhuhr ?",
              'peut-on regrouper les prières en voyage ?',
          ]
          for query in queries:
              url = base + '/api/rag/v4/search?' + urllib.parse.urlencode({'q':query,'limit':8})
              req = urllib.request.Request(url, headers={'Origin':'https://ibradevweb.github.io','Accept':'application/json','User-Agent':'Athar-V5-check'})
              with urllib.request.urlopen(req, timeout=120) as r:
                  payload = json.loads(r.read().decode('utf-8'))
                  cors = r.headers.get('Access-Control-Allow-Origin')
              print(query, '=>', payload.get('count'), payload.get('analysis'))
              print([(s.get('title'), s.get('page'), s.get('relevance'), s.get('matched_concepts')) for s in payload.get('sources',[])[:5]])
              assert cors == 'https://ibradevweb.github.io', cors
              assert payload.get('engine') == 'rag-v5-hybrid-multilingual', payload
              assert payload.get('sources'), payload
          first = queries[0]
          url = base + '/api/rag/v4/search?' + urllib.parse.urlencode({'q':first,'limit':8})
          with urllib.request.urlopen(url, timeout=120) as r:
              payload = json.loads(r.read().decode('utf-8'))
          assert 'recitation_aloud' in payload['analysis']['concepts'], payload['analysis']
          assert any('recitation_aloud' in s['matched_concepts'] for s in payload['sources']), payload['sources']
          print('PUBLIC RAG V5 NATURAL FRENCH RETRIEVAL: PASS')
          PY
