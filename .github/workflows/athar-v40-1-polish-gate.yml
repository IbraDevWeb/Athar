name: Athar V40.1 Research Library polish regression

on:
  workflow_dispatch:

concurrency:
  group: athar-v40-1-polish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V40.1 assets
        shell: bash
        run: |
          set -euo pipefail
          node --check js/ux-v40-research-library.js
          node --check js/ux-v40-polish.js
          node --check js/components/ScholarLibraryV4View.js
          node scripts/validate-interactions.js
          node scripts/validate-rag-v4.js
          python - <<'PY'
          from pathlib import Path
          css = Path('css/athar-v40-polish.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}')
          for rel in ['js/config.js', 'research-library.html', 'service-worker.js']:
              text = Path(rel).read_text(encoding='utf-8')
              assert 'athar-v40-polish.css' in text
              assert 'ux-v40-polish.js' in text
          print('Athar V40.1 regression contracts: PASS')
          PY
