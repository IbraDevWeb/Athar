name: Build compressed hosted RAG corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rag-corpus-gzip.yml'

permissions:
  contents: write

concurrency:
  group: athar-hosted-rag-corpus-gzip
  cancel-in-progress: true

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ATHAR_OPENITI_WORKERS: '6'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r rag/requirements.txt
      - name: Build OpenITI corpus
        run: python rag/build_hosted_corpus.py --db rag/data/athar_hosted.sqlite --max-books 50 --min-books 45
      - name: Add tafsir corpus
        run: python rag/ingest_tafsir.py --db rag/data/athar_hosted.sqlite --min-books 4
      - name: Compress corpus
        run: gzip -6 -c rag/data/athar_hosted.sqlite > rag/data/athar_hosted.sqlite.gz
      - name: Print corpus fingerprint
        run: sha256sum rag/data/athar_hosted.sqlite.gz && stat -c '%s' rag/data/athar_hosted.sqlite.gz
      - name: Publish compressed corpus release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rag-corpus-v2
          name: Athar hosted RAG corpus v2
          files: rag/data/athar_hosted.sqlite.gz
          make_latest: false
          overwrite_files: true
