name: Build hosted RAG corpus

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Curate Athar corpus']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'rag/corpus_policy.json'
      - 'rag/corpus_approval.json'
      - 'rag/corpus_shards.py'
      - 'rag/openiti_books.json'
      - 'rag/openiti_books_extra.json'
      - 'rag/openiti_books_extra_40.json'
      - 'rag/openiti_books_auto.json'
      - 'rag/openiti_books_priority.json'
      - 'rag/openiti_books_tafsir.json'
      - 'rag/corpus_book_curation.json'
      - 'rag/starter_corpus.json'
      - 'rag/kutub_corpus.json'
      - 'rag/openiti.py'
      - 'rag/ingest_openiti.py'
      - 'rag/build_sharded_corpus.py'
      - '.github/workflows/build-rag-corpus.yml'

permissions:
  contents: write

concurrency:
  group: athar-hosted-rag-corpus-industrial
  cancel-in-progress: true

jobs:
  build-corpus:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ATHAR_OPENITI_WORKERS: '6'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Resolve industrial corpus policy
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('rag/corpus_policy.json').read_text(encoding='utf-8'))
          hosted = policy['hosted']
          curation = policy.get('curation') or {}
          values = {
              'TARGET_INDUSTRIAL_OPENITI': int(hosted['target_openiti_books']),
              'MIN_FINAL_OPENITI': int(hosted.get('expected_openiti_books_after_tafsir') or hosted['target_openiti_books']),
              'REQUIRED_PRIORITY_P1': int(curation.get('required_priority_p1') or 0),
              'REQUIRED_CURATED_OPENITI': int(curation.get('required_curated_openiti_books') or 0),
              'READER_PARSER_VERSION': str(curation.get('reader_parser_version') or ''),
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in values.items(): handle.write(f'{key}={value}\n')
          print(values)
          PY

      - name: Verify quality-first descriptors
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          priority_path = Path('rag/corpus_priority_report.json')
          curation_path = Path('rag/corpus_book_curation.json')
          ready = priority_path.exists() and curation_path.exists()
          detail = []
          if ready:
              priority = json.loads(priority_path.read_text(encoding='utf-8'))
              curation = json.loads(curation_path.read_text(encoding='utf-8'))
              required_priority = int(os.environ.get('REQUIRED_PRIORITY_P1') or 0)
              required_curated = int(os.environ.get('REQUIRED_CURATED_OPENITI') or 0)
              parser_version = os.environ.get('READER_PARSER_VERSION') or ''
              checks = {
                  'priority': int(priority.get('resolved') or 0) >= required_priority and not priority.get('missing'),
                  'curation_count': int(curation.get('books_reviewed') or 0) >= required_curated,
                  'parser_version': str(curation.get('parser_version') or '') == parser_version,
              }
              ready = all(checks.values()); detail.append(str(checks))
          else:
              detail.append('generated curation descriptors are not committed yet')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle: handle.write(f'CURATION_READY={1 if ready else 0}\n')
          print(f'Quality-first descriptors ready={ready}: {"; ".join(detail)}')
          PY

      - name: Verify exact promotion approval
        shell: bash
        run: |
          AUTO_BLOB="$(git hash-object rag/openiti_books_auto.json)"
          export AUTO_BLOB
          python - <<'PY'
          import json, os
          from pathlib import Path
          approval = json.loads(Path('rag/corpus_approval.json').read_text(encoding='utf-8'))
          auto = json.loads(Path('rag/openiti_books_auto.json').read_text(encoding='utf-8'))
          actual_blob = os.environ['AUTO_BLOB'].strip()
          approved_blob = str(approval.get('approved_auto_manifest_blob') or '').strip()
          actual_books = len([book for book in auto.get('books', []) if isinstance(book, dict) and book.get('enabled', True)])
          approved_books = int(approval.get('approved_auto_books') or 0)
          ok = bool(approved_blob) and approved_blob == actual_blob and approved_books == actual_books
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'APPROVAL_OK={1 if ok else 0}\n'); handle.write(f'AUTO_MANIFEST_BLOB={actual_blob}\n'); handle.write(f'AUTO_BOOKS={actual_books}\n')
          print(f'Corpus approval: ok={ok}; auto_books={actual_books}; actual_blob={actual_blob}; approved_blob={approved_blob or "none"}')
          PY

      - name: Check approved curated queue is ready
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'rag')
          from ingest_openiti import load_industrialized_manifest
          manifest = load_industrialized_manifest()
          available = sum(1 for book in manifest.get('books', []) if isinstance(book, dict) and book.get('enabled', True))
          target = int(os.environ['TARGET_INDUSTRIAL_OPENITI'])
          approval_ok = os.environ.get('APPROVAL_OK') == '1'; curation_ready = os.environ.get('CURATION_READY') == '1'
          skip = available < target or not approval_ok or not curation_ready
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'SKIP_CORPUS_BUILD={1 if skip else 0}\n'); handle.write(f'AVAILABLE_INDUSTRIAL_OPENITI={available}\n')
          print(f'Curated OpenITI queue: {available} available / {target} minimum; approval={approval_ok}; curation={curation_ready}; skip={skip}')
          PY

      - name: Explain guarded build skip
        if: env.SKIP_CORPUS_BUILD == '1'
        run: |
          echo "Aucun asset V3 n'est publié."
          echo "Le build attend la résolution des priorités P1, l'overlay de curation complet et l'approbation exacte du manifeste automatique."

      - name: Generate deterministic shard registry
        if: env.SKIP_CORPUS_BUILD != '1'
        run: python rag/corpus_shards.py --output rag/corpus_shards.json

      - name: Validate shard registry covers the full OpenITI corpus
        if: env.SKIP_CORPUS_BUILD != '1'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'rag')
          from corpus_shards import load_shardable_manifest
          manifest = load_shardable_manifest(); registry = json.loads(Path('rag/corpus_shards.json').read_text(encoding='utf-8'))
          enabled = [book for book in manifest.get('books', []) if isinstance(book, dict) and book.get('enabled', True)]
          ids = {str(book['book_id']) for book in enabled}
          assert registry['total_books'] == len(ids); assert set(registry['book_to_shard']) == ids; assert registry['total_shards'] >= 1
          assert all(int(shard['book_count']) <= int(registry['limits']['max_books_per_shard']) for shard in registry['shards'])
          minimum = int(os.environ['MIN_FINAL_OPENITI'])
          if len(ids) < minimum: raise SystemExit(f'Shardable OpenITI corpus below curated milestone: {len(ids)} < {minimum}')
          print(f'Shard registry validated: {len(ids)} OpenITI books in {registry["total_shards"]} shard(s).')
          PY

      - name: Build or reuse independent SQLite shards
        if: env.SKIP_CORPUS_BUILD != '1'
        run: >-
          python rag/build_sharded_corpus.py
          --output-dir rag/data/sharded_build
          --registry rag/corpus_shards.json
          --previous-release rag/corpus_release_v3.json
          --min-openiti-books "$MIN_FINAL_OPENITI"
          --workers "$ATHAR_OPENITI_WORKERS"

      - name: Validate reader-cleaned sharded build manifest
        if: env.SKIP_CORPUS_BUILD != '1'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('rag/data/sharded_build'); payload = json.loads((root / 'sharded_build.json').read_text(encoding='utf-8'))
          assert payload['storage_mode'] == 'sharded'; assert payload['shard_build_version']; assert int(payload['openiti_books']) >= int(os.environ['MIN_FINAL_OPENITI'])
          assert int(payload['books']) >= int(payload['openiti_books']); assert int(payload['chunks']) > int(payload['books'])
          assert int(payload['shard_count']) == len(payload['shards']); assert int(payload['reused_shards']) + int(payload['rebuilt_shards']) == int(payload['shard_count']); assert set(payload['book_to_shard'])
          catalog = payload['catalog']; catalog_asset = root / catalog['asset']; assert catalog.get('reuse_status') == 'rebuilt'; assert catalog_asset.exists() and catalog_asset.stat().st_size == int(catalog['size_bytes'])
          for entry in payload['shards']:
              assert entry['compression'] == 'gzip'; assert len(str(entry['sha256'])) == 64; assert len(str(entry['database_sha256'])) == 64
              asset = root / entry['asset']
              if entry.get('reuse_status') == 'reused':
                  assert entry.get('url'); assert entry.get('source_signature'); assert entry.get('shard_build_version') == payload['shard_build_version']
              else:
                  assert asset.exists() and asset.stat().st_size == int(entry['size_bytes'])
                  if str(entry['id']).startswith('openiti-'):
                      assert entry.get('source_signature'); assert entry.get('shard_build_version') == payload['shard_build_version']
          print(f"Curated sharded corpus validated: {payload['books']} books, {payload['openiti_books']} OpenITI, {payload['chunks']} chunks, {payload['shard_count']} shard(s), {payload['reused_shards']} reused / {payload['rebuilt_shards']} rebuilt")
          PY

      - name: Publish only rebuilt SQLite assets
        if: env.SKIP_CORPUS_BUILD != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rag-corpus-v3
          name: Athar sharded RAG corpus v3
          body: Corpus Athar distribué et curaté, avec textes OpenITI nettoyés pour la lecture, métadonnées de curation et références P1 prioritaires.
          files: rag/data/sharded_build/*.sqlite.gz
          make_latest: false
          overwrite_files: true

      - name: Write V3 release manifest
        if: env.SKIP_CORPUS_BUILD != '1'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          build_path = Path('rag/data/sharded_build/sharded_build.json'); payload = json.loads(build_path.read_text(encoding='utf-8'))
          tag = 'rag-corpus-v3'; base = f'https://github.com/IbraDevWeb/Athar/releases/download/{tag}'
          payload['tag'] = tag; payload['release_name'] = 'Athar sharded RAG corpus v3'; payload['catalog']['url'] = f"{base}/{payload['catalog']['asset']}"
          for shard in payload['shards']: shard['url'] = f"{base}/{shard['asset']}"
          Path('rag/corpus_release_v3.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'books': payload['books'], 'openiti_books': payload['openiti_books'], 'chunks': payload['chunks'], 'shards': payload['shard_count'], 'reused_shards': payload['reused_shards'], 'rebuilt_shards': payload['rebuilt_shards'], 'manifest': 'rag/corpus_release_v3.json'}, ensure_ascii=False))
          PY

      - name: Commit V3 manifest and current shard registry
        if: env.SKIP_CORPUS_BUILD != '1'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rag/corpus_release_v3.json rag/corpus_shards.json
          if git diff --cached --quiet; then echo 'V3 manifest and shard registry already current.'; else git commit -m 'Publier le corpus Athar curaté sharded V3'; git push origin HEAD:main; fi

      - name: Archive sharded build statistics
        if: env.SKIP_CORPUS_BUILD != '1'
        uses: actions/upload-artifact@v4
        with:
          name: athar-rag-sharded-corpus-stats
          path: rag/data/sharded_build/sharded_build.json
          if-no-files-found: error
          retention-days: 30
