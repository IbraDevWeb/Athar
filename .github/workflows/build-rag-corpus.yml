name: Build hosted RAG corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rag/corpus_policy.json'
      - 'rag/corpus_approval.json'
      - 'rag/corpus_shards.py'
      - 'rag/openiti_books.json'
      - 'rag/openiti_books_extra.json'
      - 'rag/openiti_books_extra_40.json'
      - 'rag/openiti_books_auto.json'
      - 'rag/openiti_books_tafsir.json'
      - 'rag/starter_corpus.json'
      - 'rag/kutub_corpus.json'
      - 'rag/ingest_openiti.py'
      - 'rag/build_sharded_corpus.py'
      - '.github/workflows/build-rag-corpus.yml'

permissions:
  contents: write

concurrency:
  group: athar-hosted-rag-corpus-industrial
  cancel-in-progress: true

jobs:
  build-corpus:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ATHAR_OPENITI_WORKERS: '6'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Resolve industrial corpus policy
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('rag/corpus_policy.json').read_text(encoding='utf-8'))['hosted']
          values = {
              'TARGET_INDUSTRIAL_OPENITI': int(policy['target_openiti_books']),
              'MIN_FINAL_OPENITI': int(policy.get('expected_openiti_books_after_tafsir') or policy['target_openiti_books']),
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
          print(values)
          PY

      - name: Verify exact promotion approval
        shell: bash
        run: |
          AUTO_BLOB="$(git hash-object rag/openiti_books_auto.json)"
          export AUTO_BLOB
          python - <<'PY'
          import json, os
          from pathlib import Path
          approval = json.loads(Path('rag/corpus_approval.json').read_text(encoding='utf-8'))
          auto = json.loads(Path('rag/openiti_books_auto.json').read_text(encoding='utf-8'))
          actual_blob = os.environ['AUTO_BLOB'].strip()
          approved_blob = str(approval.get('approved_auto_manifest_blob') or '').strip()
          actual_books = len([book for book in auto.get('books', []) if isinstance(book, dict) and book.get('enabled', True)])
          approved_books = int(approval.get('approved_auto_books') or 0)
          ok = bool(approved_blob) and approved_blob == actual_blob and approved_books == actual_books
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'APPROVAL_OK={1 if ok else 0}\n')
              handle.write(f'AUTO_MANIFEST_BLOB={actual_blob}\n')
              handle.write(f'AUTO_BOOKS={actual_books}\n')
          print(f'Corpus approval: ok={ok}; auto_books={actual_books}; actual_blob={actual_blob}; approved_blob={approved_blob or "none"}')
          PY

      - name: Check approved industrial queue is ready
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'rag')
          from ingest_openiti import load_industrialized_manifest
          manifest = load_industrialized_manifest()
          available = sum(1 for book in manifest.get('books', []) if isinstance(book, dict) and book.get('enabled', True))
          target = int(os.environ['TARGET_INDUSTRIAL_OPENITI'])
          approval_ok = os.environ.get('APPROVAL_OK') == '1'
          skip = available < target or not approval_ok
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'SKIP_CORPUS_BUILD={1 if skip else 0}\n')
              handle.write(f'AVAILABLE_INDUSTRIAL_OPENITI={available}\n')
          print(f'Industrial OpenITI queue: {available} available / {target} minimum; approval={approval_ok}; skip={skip}')
          PY

      - name: Explain guarded build skip
        if: env.SKIP_CORPUS_BUILD == '1'
        run: |
          echo "Aucun asset V3 n'est publié."
          echo "Le build exige une file industrielle suffisante et une approbation correspondant exactement au blob automatique."

      - name: Generate deterministic shard registry
        if: env.SKIP_CORPUS_BUILD != '1'
        run: python rag/corpus_shards.py --output rag/corpus_shards.json

      - name: Validate shard registry covers the full OpenITI corpus
        if: env.SKIP_CORPUS_BUILD != '1'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'rag')
          from corpus_shards import load_shardable_manifest
          manifest = load_shardable_manifest()
          registry = json.loads(Path('rag/corpus_shards.json').read_text(encoding='utf-8'))
          enabled = [book for book in manifest.get('books', []) if isinstance(book, dict) and book.get('enabled', True)]
          ids = {str(book['book_id']) for book in enabled}
          assert registry['total_books'] == len(ids)
          assert set(registry['book_to_shard']) == ids
          assert registry['total_shards'] >= 1
          assert all(int(shard['book_count']) <= int(registry['limits']['max_books_per_shard']) for shard in registry['shards'])
          minimum = int(os.environ['MIN_FINAL_OPENITI'])
          if len(ids) < minimum:
              raise SystemExit(f'Shardable OpenITI corpus below milestone: {len(ids)} < {minimum}')
          print(f'Shard registry validated: {len(ids)} OpenITI books in {registry["total_shards"]} shard(s).')
          PY

      - name: Build independent SQLite shards
        if: env.SKIP_CORPUS_BUILD != '1'
        run: >-
          python rag/build_sharded_corpus.py
          --output-dir rag/data/sharded_build
          --registry rag/corpus_shards.json
          --min-openiti-books "$MIN_FINAL_OPENITI"
          --workers "$ATHAR_OPENITI_WORKERS"

      - name: Validate sharded build manifest
        if: env.SKIP_CORPUS_BUILD != '1'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('rag/data/sharded_build')
          payload = json.loads((root / 'sharded_build.json').read_text(encoding='utf-8'))
          assert payload['storage_mode'] == 'sharded'
          assert int(payload['openiti_books']) >= int(os.environ['MIN_FINAL_OPENITI'])
          assert int(payload['books']) >= int(payload['openiti_books'])
          assert int(payload['chunks']) > int(payload['books'])
          assert int(payload['shard_count']) == len(payload['shards'])
          assert set(payload['book_to_shard'])
          entries = [payload['catalog'], *payload['shards']]
          for entry in entries:
              asset = root / entry['asset']
              assert asset.exists() and asset.stat().st_size == int(entry['size_bytes'])
              assert entry['compression'] == 'gzip'
              assert len(str(entry['sha256'])) == 64
              assert len(str(entry['database_sha256'])) == 64
          print(f"Sharded corpus validated: {payload['books']} books, {payload['openiti_books']} OpenITI, {payload['chunks']} chunks, {payload['shard_count']} shard(s)")
          PY

      - name: Publish parallel sharded SQLite release
        if: env.SKIP_CORPUS_BUILD != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rag-corpus-v3
          name: Athar sharded RAG corpus v3
          body: Corpus Athar découpé en SQLite indépendants avec catalogue central. Cette release est publiée en parallèle du corpus V2 jusqu'à validation du basculement Render.
          files: rag/data/sharded_build/*.sqlite.gz
          make_latest: false
          overwrite_files: true

      - name: Write parallel V3 release manifest
        if: env.SKIP_CORPUS_BUILD != '1'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          build_path = Path('rag/data/sharded_build/sharded_build.json')
          payload = json.loads(build_path.read_text(encoding='utf-8'))
          tag = 'rag-corpus-v3'
          base = f'https://github.com/IbraDevWeb/Athar/releases/download/{tag}'
          payload['tag'] = tag
          payload['release_name'] = 'Athar sharded RAG corpus v3'
          payload['catalog']['url'] = f"{base}/{payload['catalog']['asset']}"
          for shard in payload['shards']:
              shard['url'] = f"{base}/{shard['asset']}"
          Path('rag/corpus_release_v3.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'books': payload['books'],
              'openiti_books': payload['openiti_books'],
              'chunks': payload['chunks'],
              'shards': payload['shard_count'],
              'manifest': 'rag/corpus_release_v3.json',
          }, ensure_ascii=False))
          PY

      - name: Commit V3 manifest and current shard registry
        if: env.SKIP_CORPUS_BUILD != '1'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rag/corpus_release_v3.json rag/corpus_shards.json
          if git diff --cached --quiet; then
            echo 'V3 manifest and shard registry already current.'
          else
            git commit -m 'Publier le corpus Athar sharded V3 en parallèle'
            git push origin HEAD:main
          fi

      - name: Archive sharded build statistics
        if: env.SKIP_CORPUS_BUILD != '1'
        uses: actions/upload-artifact@v4
        with:
          name: athar-rag-sharded-corpus-stats
          path: rag/data/sharded_build/sharded_build.json
          if-no-files-found: error
          retention-days: 30
