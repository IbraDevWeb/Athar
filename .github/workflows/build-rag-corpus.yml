name: Build hosted RAG corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rag-corpus.yml'
      - 'rag/openiti_books.json'
      - 'rag/openiti_books_extra.json'
      - 'rag/openiti_books_tafsir.json'
      - 'rag/openiti.py'
      - 'rag/ingest_openiti.py'
      - 'rag/ingest_tafsir.py'
      - 'rag/build_hosted_corpus.py'
      - 'rag/starter_corpus.json'
      - 'rag/kutub_corpus.json'

permissions:
  contents: write

concurrency:
  group: athar-hosted-rag-corpus
  cancel-in-progress: false

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Build OpenITI corpus
        run: |
          python rag/build_hosted_corpus.py \
            --db rag/data/athar_hosted.sqlite \
            --max-books 50 \
            --min-books 45

      - name: Add tafsir corpus
        run: |
          python rag/ingest_tafsir.py \
            --db rag/data/athar_hosted.sqlite \
            --min-books 4

      - name: Validate final SQLite corpus
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = Path('rag/data/athar_hosted.sqlite')
          assert db.exists() and db.stat().st_size > 0
          con = sqlite3.connect(db)
          try:
              assert con.execute('PRAGMA quick_check').fetchone()[0] == 'ok'
              books = int(con.execute('SELECT COUNT(*) FROM books').fetchone()[0])
              chunks = int(con.execute('SELECT COUNT(*) FROM chunks').fetchone()[0])
              openiti = int(con.execute("SELECT COUNT(DISTINCT book_id) FROM chunks WHERE translation_status='openiti_arabic_source'").fetchone()[0])
              assert openiti >= 45, (books, chunks, openiti)
              assert chunks > openiti
              print(f'Corpus validated: {books} books, {openiti} OpenITI books, {chunks} chunks, {db.stat().st_size} bytes')
          finally:
              con.close()
          PY

      - name: Publish SQLite corpus release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rag-corpus-latest
          name: Athar hosted RAG corpus
          body: Corpus SQLite préconstruit pour le backend RAG Athar, généré depuis les sources ouvertes configurées dans le dépôt.
          files: rag/data/athar_hosted.sqlite
          make_latest: false

      - name: Archive build statistics
        uses: actions/upload-artifact@v4
        with:
          name: athar-rag-corpus-stats
          path: rag/data/athar_hosted.stats.json
          if-no-files-found: warn
          retention-days: 30
