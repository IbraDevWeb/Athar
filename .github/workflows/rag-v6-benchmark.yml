name: Athar RAG V6 benchmark

on:
  push:
    branches: [main]
    paths:
      - 'rag/benchmark_v6.json'
      - 'rag/v6_benchmark.py'
      - 'rag/BENCHMARK.md'
      - 'rag/corpus_release_v3.json'
      - '.github/workflows/rag-v6-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: rag-v6-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ATHAR_QUERY_LLM_ENABLED: '0'
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RAG dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Compile benchmark
        run: >-
          python -m py_compile
          rag/v5_engine.py
          rag/v5_lowmem.py
          rag/v5_sharded.py
          rag/v6_benchmark.py

      - name: Cache published sharded corpus
        run: >-
          python rag/cache_hosted_corpus.py
          --manifest rag/corpus_release_v3.json
          --output-dir rag/data/benchmark-shards

      - name: Run deterministic benchmark
        run: >-
          python rag/v6_benchmark.py
          --dataset rag/benchmark_v6.json
          --manifest rag/corpus_release_v3.json
          --shard-dir rag/data/benchmark-shards
          --output-json rag/data/benchmark-report.json
          --output-md rag/data/BENCHMARK_REPORT.md
          --require-citation-integrity

      - name: Add benchmark summary
        if: always()
        shell: bash
        run: |
          if [ -f rag/data/BENCHMARK_REPORT.md ]; then
            cat rag/data/BENCHMARK_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athar-rag-v6-benchmark
          path: |
            rag/data/benchmark-report.json
            rag/data/BENCHMARK_REPORT.md
          if-no-files-found: warn
          retention-days: 30
