name: Validate static application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RAG parser dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Reject unresolved merge conflicts
        shell: bash
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' . \
            --exclude-dir=.git \
            --exclude='*.md'; then
            echo 'Unresolved Git conflict marker found.'
            exit 1
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Check Python syntax
        run: python -m py_compile rag/core.py rag/v2.py rag/server.py rag/launcher.py rag/stop_server.py rag/scrape_kutub.py rag/sync_kutub_batch.py scripts/validate_rag_runtime.py scripts/validate_rag_starter_corpus.py scripts/validate_rag_launcher_runtime.py scripts/validate_rag_cross_port.py

      - name: Validate global interactions and Vue DOM
        run: node scripts/validate-interactions.js

      - name: Validate Athar Lens
        run: node scripts/validate-athar-lens.js

      - name: Validate Scholar RAG library V1
        run: node scripts/validate-rag-library.js

      - name: Validate Scholar RAG library V2
        run: node scripts/validate-rag-v2.js

      - name: Validate RAG server launcher
        run: node scripts/validate-rag-launcher.js

      - name: Validate RAG API bridge
        run: node scripts/validate-rag-api-bridge.js

      - name: Execute RAG launcher runtime
        run: python scripts/validate_rag_launcher_runtime.py

      - name: Execute RAG cross-port runtime
        run: python scripts/validate_rag_cross_port.py

      - name: Execute Scholar RAG runtime
        run: python scripts/validate_rag_runtime.py

      - name: Execute starter corpus migration
        run: python scripts/validate_rag_starter_corpus.py

      - name: Validate Ancient Sky interface
        run: node scripts/validate-astronomy.js

      - name: Validate History Nights reader
        run: node scripts/validate-history-nights.js

      - name: Validate Scriptorium gallery
        run: node scripts/validate-scriptorium.js

      - name: Validate Root Tree explorer
        run: node scripts/validate-root-tree.js

      - name: Validate Golden Chain explorer
        run: node scripts/validate-golden-chain.js

      - name: Validate Transmission data
        run: node scripts/validate-transmission.js

      - name: Validate Atlas data
        run: node scripts/validate-atlas.js

      - name: Validate Scholar Atlas data
        run: node scripts/validate-scholar-atlas.js

      - name: Validate expanded Scholar Atlas data
        run: node scripts/validate-scholar-atlas-expanded.js

      - name: Validate Constellation data
        run: node scripts/validate-constellation.js

      - name: Validate Constellation study interface
        run: node scripts/validate-constellation-study.js

      - name: Validate Tasbih interface
        run: node scripts/validate-tasbih.js

      - name: Validate fullscreen and timeline
        run: node scripts/validate-fullscreen-timeline.js

      - name: Validate immersive navigation and Adhkar
        run: node scripts/validate-immersive-adhkar.js

      - name: Validate Hadith library and reader
        run: node scripts/validate-hadith.js

      - name: Validate Oussoul al-Fiqh and video PiP
        run: node scripts/validate-ussul.js

      - name: Validate encyclopedic library
        run: node scripts/validate-library.js

      - name: Validate mobile and immersive UX
        run: node scripts/validate-mobile-ux.js

      - name: Validate immersive dark theme
        run: node scripts/validate-immersive-theme.js
