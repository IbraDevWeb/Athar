name: Validate static application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reject unresolved merge conflicts
        shell: bash
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' . --exclude-dir=.git --exclude='*.md'; then
            echo 'Unresolved Git conflict marker found.'
            exit 1
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Check clean public application
        run: node scripts/validate-clean-core.js

      - name: Validate global interactions
        run: node scripts/validate-interactions.js

      - name: Validate seven public sections
        run: node scripts/validate-public-navigation.js

      - name: Validate Siyar bibliography
        run: node scripts/validate-biography-sources.js

      - name: Validate library
        run: node scripts/validate-library.js

      - name: Validate chronology and immersive UI
        run: node scripts/validate-fullscreen-timeline.js

      - name: Validate hadiths
        run: node scripts/validate-hadith.js

      - name: Validate Adhkar and immersive navigation
        run: node scripts/validate-immersive-adhkar.js

      - name: Validate Tasbih
        run: node scripts/validate-tasbih.js

      - name: Validate mobile
        run: node scripts/validate-mobile-ux.js

      - name: Validate dark theme
        run: node scripts/validate-immersive-theme.js
