name: Probe current Render RAG

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rag-v4-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe health
        run: |
          python - <<'PY'
          import urllib.request
          for url in [
              'https://athar-rag-ibradevweb.onrender.com/healthz',
              'https://athar-rag-ibradevweb.onrender.com/api/rag/v4/status',
              'https://athar-rag-ibradevweb.onrender.com/api/rag/v2/status',
          ]:
              print('\nURL', url)
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      body = r.read().decode('utf-8')
                      print('HTTP', r.status)
                      print(body[:2000])
              except Exception as exc:
                  print(type(exc).__name__, exc)
          PY
