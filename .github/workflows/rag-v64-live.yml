name: Athar RAG V6.4 live production gate

on:
  workflow_run:
    workflows: ['Athar RAG V6.4 production smoke']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rag-v64-live.yml'

concurrency:
  group: rag-v64-live-production-gate
  cancel-in-progress: true

jobs:
  verify-live-v64:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Wait for warmed V6.4.2 on Render
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base = 'https://athar-rag-ibradevweb.onrender.com'
          expected = 'rag-v6.4-v63c-fused-production'
          headers = {'Cache-Control':'no-cache','User-Agent':'Athar-V6.4-live-gate'}
          last = None
          for attempt in range(1, 91):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base + '/healthz', headers=headers), timeout=30) as r:
                      health = json.load(r)
                  with urllib.request.urlopen(urllib.request.Request(base + '/api/rag/v5/status', headers=headers), timeout=60) as r:
                      status = json.load(r)
                  last = {'health': health, 'status': status}
                  brief = {
                      'health_engine': health.get('engine'),
                      'status_engine': status.get('engine'),
                      'fallback': status.get('retrieval_fallback'),
                      'warmup': status.get('semantic_warmup_complete'),
                      'warmup_ms': status.get('semantic_warmup_ms'),
                      'ann_vectors': status.get('ann_vectors'),
                  }
                  print(f'live {attempt}/90: {json.dumps(brief, ensure_ascii=False)}', flush=True)
                  if (
                      health.get('ok')
                      and health.get('engine') == expected
                      and status.get('engine') == expected
                      and status.get('retrieval_engine_active') == expected
                      and status.get('retrieval_fallback') is False
                      and status.get('semantic_embeddings') is True
                      and status.get('semantic_warmup_complete') is True
                      and int(status.get('ann_vectors') or 0) == 574461
                  ):
                      print('PUBLIC ATHAR V6.4.2 WARMED CONTRACT: PASS')
                      break
              except Exception as exc:
                  last = repr(exc)
                  print(f'live {attempt}/90 error: {exc}', flush=True)
              time.sleep(20)
          else:
              raise SystemExit(f'V6.4.2 did not become live: {last}')
          PY

      - name: Verify V6.4 status and ANN identity
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://athar-rag-ibradevweb.onrender.com/api/rag/v5/status'
          req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','User-Agent':'Athar-V6.4-live-gate'})
          with urllib.request.urlopen(req, timeout=60) as response:
              status = json.load(response)
          print(json.dumps(status, ensure_ascii=False, indent=2))
          assert status.get('engine') == 'rag-v6.4-v63c-fused-production', status
          assert status.get('retrieval_engine_active') == 'rag-v6.4-v63c-fused-production', status
          assert status.get('retrieval_engine_configured') == 'v63c', status
          assert status.get('retrieval_fallback') is False, status
          assert status.get('semantic_embeddings') is True, status
          assert status.get('semantic_warmup_complete') is True, status
          assert status.get('semantic_model') == 'sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2', status
          assert status.get('ann_storage_mode') == 'disk_view', status
          assert int(status.get('ann_vectors') or 0) == 574461, status
          assert int(status.get('chunks') or 0) == 574461, status
          assert int(status.get('books') or 0) == 215, status
          print('PUBLIC ATHAR V6.4.2 STATUS: PASS')
          PY

      - name: Verify fused evidence and canonical citations
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.error, urllib.request
          base = 'https://athar-rag-ibradevweb.onrender.com'
          payload = {'query': "Quelles sont les règles du tayammum lorsqu'une personne ne peut pas utiliser l'eau ?", 'limit': 8}
          data = json.dumps(payload).encode('utf-8')
          result = None
          cors = None
          last = None
          for attempt in range(1, 6):
              try:
                  request = urllib.request.Request(
                      base + '/api/rag/v5/ask', data=data,
                      headers={
                          'Content-Type':'application/json',
                          'Origin':'https://ibradevweb.github.io',
                          'Cache-Control':'no-cache',
                          'User-Agent':'Athar-V6.4-live-gate',
                      }, method='POST')
                  with urllib.request.urlopen(request, timeout=120) as response:
                      result = json.load(response)
                      cors = response.headers.get('Access-Control-Allow-Origin')
                  break
              except Exception as exc:
                  last = exc
                  print(f'fused attempt {attempt}/5 failed: {exc}', flush=True)
                  if attempt < 5:
                      time.sleep(10)
          if result is None:
              raise SystemExit(f'Persistent fused request failure: {last}')
          analysis = result.get('analysis') or {}
          sources = result.get('sources') or []
          print(json.dumps({
              'engine': result.get('engine'), 'count': result.get('count'),
              'ann_query_ms': analysis.get('ann_query_ms'),
              'ann_candidates': analysis.get('ann_candidate_count'),
              'ann_only': analysis.get('ann_only_candidate_count'),
              'top': [
                  {'citation_id': s.get('citation_id'), 'id': s.get('id'), 'book_id': s.get('book_id'), 'title': s.get('title'), 'origin': s.get('retrieval_origin')}
                  for s in sources[:5]
              ],
          }, ensure_ascii=False, indent=2))
          assert cors == 'https://ibradevweb.github.io', cors
          assert result.get('engine') == 'rag-v6.4-v63c-fused-production', result
          assert analysis.get('retrieval_engine_active') == 'rag-v6.4-v63c-fused-production', analysis
          assert analysis.get('retrieval_fallback') is False, analysis
          assert analysis.get('ann_shadow_mode') is False, analysis
          assert sources, result
          assert 'shadow_ann_sources' not in result and 'shadow_ann_only_sources' not in result
          for rank, source in enumerate(sources, 1):
              assert source.get('citation_id') == f'S{rank}', source
              assert source.get('id') and source.get('book_id') and source.get('title'), source
          print('PUBLIC ATHAR V6.4.2 FUSED RETRIEVAL: PASS')
          PY

      - name: Verify V6.1 abstention remains authoritative
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request
          payload = {'query': 'Comment configurer Ethernet sur une station spatiale dans Sahih al-Bukhari ?', 'limit': 8}
          data = json.dumps(payload).encode('utf-8')
          result = None
          last = None
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      'https://athar-rag-ibradevweb.onrender.com/api/rag/v5/ask', data=data,
                      headers={'Content-Type':'application/json','Cache-Control':'no-cache','User-Agent':'Athar-V6.4-live-gate'}, method='POST')
                  with urllib.request.urlopen(request, timeout=120) as response:
                      result = json.load(response)
                  break
              except Exception as exc:
                  last = exc
                  print(f'abstention attempt {attempt}/3 failed: {exc}', flush=True)
                  if attempt < 3:
                      time.sleep(10)
          if result is None:
              raise SystemExit(f'Persistent abstention request failure: {last}')
          analysis = result.get('analysis') or {}
          print(json.dumps({'count': result.get('count'), 'verdict': (result.get('answer') or {}).get('verdict'), 'engine': result.get('engine'), 'fallback': analysis.get('retrieval_fallback')}, ensure_ascii=False, indent=2))
          assert result.get('engine') == 'rag-v6.4-v63c-fused-production', result
          assert analysis.get('retrieval_fallback') is False, analysis
          assert not (result.get('sources') or []), result
          assert (result.get('answer') or {}).get('verdict') == 'insufficient', result
          print('PUBLIC ATHAR V6.4.2 ABSTENTION: PASS')
          PY
