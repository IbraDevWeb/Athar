name: Athar RAG V6.4 live production gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rag-v64-live.yml'

concurrency:
  group: rag-v64-live-production-gate
  cancel-in-progress: true

jobs:
  verify-live-v64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Wait for V6.4 fused engine on Render
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request

          base = 'https://athar-rag-ibradevweb.onrender.com'
          expected = 'rag-v6.4-v63c-fused-production'
          last = None
          for attempt in range(1, 91):
              try:
                  req = urllib.request.Request(
                      base + '/healthz',
                      headers={'Cache-Control':'no-cache','User-Agent':'Athar-V6.4-live-gate'},
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      health = json.loads(response.read().decode('utf-8'))
                  last = health
                  print(f'health {attempt}/90:', health, flush=True)
                  if health.get('ok') and health.get('engine') == expected:
                      print('PUBLIC ATHAR V6.4 HEALTH: PASS')
                      break
              except Exception as exc:
                  last = repr(exc)
                  print(f'health {attempt}/90 error:', exc, flush=True)
              time.sleep(20)
          else:
              raise SystemExit(f'V6.4 did not become live: {last}')
          PY

      - name: Verify V6.4 status and ANN identity
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request

          url = 'https://athar-rag-ibradevweb.onrender.com/api/rag/v5/status'
          req = urllib.request.Request(
              url,
              headers={'Cache-Control':'no-cache','User-Agent':'Athar-V6.4-live-gate'},
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              status = json.loads(response.read().decode('utf-8'))
          print(json.dumps(status, ensure_ascii=False, indent=2))
          assert status.get('engine') == 'rag-v6.4-v63c-fused-production', status
          assert status.get('retrieval_engine_active') == 'rag-v6.4-v63c-fused-production', status
          assert status.get('retrieval_engine_configured') == 'v63c', status
          assert status.get('retrieval_fallback') is False, status
          assert status.get('ann_storage_mode') == 'disk_view', status
          assert int(status.get('ann_vectors') or 0) == 574461, status
          assert int(status.get('chunks') or 0) == 574461, status
          assert int(status.get('books') or 0) == 215, status
          print('PUBLIC ATHAR V6.4 STATUS: PASS')
          PY

      - name: Verify fused evidence and canonical citations
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request

          base = 'https://athar-rag-ibradevweb.onrender.com'
          payload = {
              'query': "Quelles sont les règles du tayammum lorsqu'une personne ne peut pas utiliser l'eau ?",
              'limit': 8,
          }
          request = urllib.request.Request(
              base + '/api/rag/v5/ask',
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  'Content-Type':'application/json',
                  'Origin':'https://ibradevweb.github.io',
                  'Cache-Control':'no-cache',
                  'User-Agent':'Athar-V6.4-live-gate',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              result = json.loads(response.read().decode('utf-8'))
              cors = response.headers.get('Access-Control-Allow-Origin')
          analysis = result.get('analysis') or {}
          sources = result.get('sources') or []
          print(json.dumps({
              'engine': result.get('engine'),
              'count': result.get('count'),
              'analysis': {
                  'retrieval_engine_active': analysis.get('retrieval_engine_active'),
                  'retrieval_fallback': analysis.get('retrieval_fallback'),
                  'ann_candidate_count': analysis.get('ann_candidate_count'),
                  'ann_only_candidate_count': analysis.get('ann_only_candidate_count'),
                  'ann_query_ms': analysis.get('ann_query_ms'),
              },
              'top': [
                  {
                      'citation_id': s.get('citation_id'),
                      'id': s.get('id'),
                      'book_id': s.get('book_id'),
                      'title': s.get('title'),
                      'retrieval_origin': s.get('retrieval_origin'),
                  }
                  for s in sources[:5]
              ],
          }, ensure_ascii=False, indent=2))
          assert cors == 'https://ibradevweb.github.io', cors
          assert result.get('engine') == 'rag-v6.4-v63c-fused-production', result
          assert analysis.get('retrieval_engine_active') == 'rag-v6.4-v63c-fused-production', analysis
          assert analysis.get('retrieval_fallback') is False, analysis
          assert analysis.get('ann_shadow_mode') is False, analysis
          assert sources, result
          assert 'shadow_ann_sources' not in result and 'shadow_ann_only_sources' not in result
          for rank, source in enumerate(sources, 1):
              assert source.get('citation_id') == f'S{rank}', source
              assert source.get('id') and source.get('book_id') and source.get('title'), source
          print('PUBLIC ATHAR V6.4 FUSED RETRIEVAL: PASS')
          PY

      - name: Verify V6.1 abstention remains authoritative
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request

          payload = {'query': 'Comment configurer Ethernet sur une station spatiale dans Sahih al-Bukhari ?', 'limit': 8}
          request = urllib.request.Request(
              'https://athar-rag-ibradevweb.onrender.com/api/rag/v5/ask',
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type':'application/json','Cache-Control':'no-cache','User-Agent':'Athar-V6.4-live-gate'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              result = json.loads(response.read().decode('utf-8'))
          analysis = result.get('analysis') or {}
          print(json.dumps({
              'count': result.get('count'),
              'verdict': (result.get('answer') or {}).get('verdict'),
              'engine': result.get('engine'),
              'fallback': analysis.get('retrieval_fallback'),
          }, ensure_ascii=False, indent=2))
          assert result.get('engine') == 'rag-v6.4-v63c-fused-production', result
          assert analysis.get('retrieval_fallback') is False, analysis
          assert not (result.get('sources') or []), result
          assert (result.get('answer') or {}).get('verdict') == 'insufficient', result
          print('PUBLIC ATHAR V6.4 ABSTENTION: PASS')
          PY
