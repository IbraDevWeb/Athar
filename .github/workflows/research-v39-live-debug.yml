name: Athar Research V39 live debug

on:
  push:
    branches: ['fix/research-v39-blank']
    paths:
      - 'scripts/research_v39_live_debug.mjs'
      - '.github/workflows/research-v39-live-debug.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/research-v39-blank
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - env:
          ATHAR_E2E_BASE: https://ibradevweb.github.io/Athar
        run: node scripts/research_v39_live_debug.mjs
