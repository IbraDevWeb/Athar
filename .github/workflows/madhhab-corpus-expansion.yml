name: Madhhab corpus expansion gate

on:
  pull_request:
    paths:
      - 'rag/corpus_policy.json'
      - 'rag/corpus_priority_targets.json'
      - 'rag/madhhab_scholar_targets.json'
      - 'rag/topic_plurality_benchmark.json'
      - 'rag/corpus_priority_ingest.py'
      - 'rag/corpus_priority_ingest_tests.py'
      - 'rag/madhhab_corpus_expansion_tests.py'
      - 'rag/corpus_curator.py'
      - 'rag/corpus_curator_tests.py'
      - '.github/workflows/madhhab-corpus-expansion.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install corpus dependencies
        run: python -m pip install -r rag/requirements.txt
      - name: Validate expansion contracts
        working-directory: rag
        run: |
          python -m py_compile corpus_priority_ingest.py corpus_curator.py
          python corpus_priority_ingest_tests.py
          python corpus_curator_tests.py
          python madhhab_corpus_expansion_tests.py

  openiti-resolution:
    runs-on: ubuntu-latest
    needs: contract
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install corpus dependencies
        run: python -m pip install -r rag/requirements.txt
      - name: Resolve against official OpenITI metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'rag')
          from openiti_catalog import fetch_metadata
          Path('/tmp/openiti_metadata.tsv').write_text(fetch_metadata(), encoding='utf-8')
          PY

          python rag/corpus_priority_ingest.py \
            --metadata /tmp/openiti_metadata.tsv \
            --targets rag/corpus_priority_targets.json \
            --manifest /tmp/openiti_books_priority.json \
            --report /tmp/corpus_priority_report.json

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          report = json.loads(Path('/tmp/corpus_priority_report.json').read_text(encoding='utf-8'))
          targets = json.loads(Path('rag/corpus_priority_targets.json').read_text(encoding='utf-8'))['targets']
          by_id = {row['id']: row for row in targets}
          resolved_ids = {row['id'] for row in report.get('already_present', [])}
          resolved_ids.update(
              row.get('reference_id') or str(row.get('book_id', '')).removeprefix('openiti-priority-')
              for row in report.get('selected', [])
          )
          p2_resolved = [
              by_id[target_id]
              for target_id in resolved_ids
              if target_id in by_id and by_id[target_id].get('priority') == 'P2'
          ]
          counts = Counter(row.get('madhhab') for row in p2_resolved)

          print('P2 resolved:', len(p2_resolved), '/', report.get('optional_targets'))
          for madhhab in ('Ḥanafite', 'Mālikite', 'Shāfiʿite', 'Ḥanbalite'):
              print(f'  {madhhab}: {counts[madhhab]}')

          assert report['resolved'] == 13, report
          assert not report['missing'], report['missing']
          for madhhab in ('Ḥanafite', 'Mālikite', 'Shāfiʿite', 'Ḥanbalite'):
              assert counts[madhhab] >= 3, (madhhab, counts[madhhab], report.get('optional_missing'))
          assert len(p2_resolved) >= 16, report
          PY
