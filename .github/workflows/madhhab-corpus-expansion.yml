name: Madhhab corpus expansion gate

on:
  pull_request:
    paths:
      - 'rag/corpus_policy.json'
      - 'rag/corpus_priority_targets.json'
      - 'rag/corpus_wave2_targets.json'
      - 'rag/corpus_wave2_hanafi.json'
      - 'rag/corpus_wave2_maliki.json'
      - 'rag/corpus_wave2_shafii.json'
      - 'rag/corpus_wave2_hanbali.json'
      - 'rag/madhhab_scholar_targets.json'
      - 'rag/topic_plurality_benchmark.json'
      - 'rag/corpus_priority_ingest.py'
      - 'rag/corpus_priority_ingest_tests.py'
      - 'rag/corpus_wave2_ingest.py'
      - 'rag/corpus_wave2_ingest_tests.py'
      - 'rag/madhhab_corpus_expansion_tests.py'
      - 'rag/corpus_curator.py'
      - 'rag/corpus_curator_tests.py'
      - '.github/workflows/madhhab-corpus-expansion.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install corpus dependencies
        run: python -m pip install -r rag/requirements.txt
      - name: Validate expansion contracts
        working-directory: rag
        run: |
          python -m py_compile corpus_priority_ingest.py corpus_wave2_ingest.py corpus_curator.py
          python corpus_priority_ingest_tests.py
          python corpus_wave2_ingest_tests.py
          python corpus_curator_tests.py
          python madhhab_corpus_expansion_tests.py

  openiti-resolution:
    runs-on: ubuntu-latest
    needs: contract
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install corpus dependencies
        run: python -m pip install -r rag/requirements.txt
      - name: Resolve P1/P2/P3 against official OpenITI metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'rag')
          from openiti_catalog import fetch_metadata
          Path('/tmp/openiti_metadata.tsv').write_text(fetch_metadata(), encoding='utf-8')
          PY

          python rag/corpus_priority_ingest.py \
            --metadata /tmp/openiti_metadata.tsv \
            --targets rag/corpus_priority_targets.json \
            --manifest rag/openiti_books_priority.json \
            --report /tmp/corpus_priority_report.json

          python rag/corpus_wave2_ingest.py \
            --metadata /tmp/openiti_metadata.tsv \
            --index rag/corpus_wave2_targets.json \
            --manifest /tmp/openiti_books_priority_wave2.json \
            --report /tmp/corpus_wave2_report.json \
            --combined-targets /tmp/corpus_all_targets.json

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          p12 = json.loads(Path('/tmp/corpus_priority_report.json').read_text(encoding='utf-8'))
          targets = json.loads(Path('rag/corpus_priority_targets.json').read_text(encoding='utf-8'))['targets']
          by_id = {row['id']: row for row in targets}
          resolved_ids = {row['id'] for row in p12.get('already_present', [])}
          resolved_ids.update(row.get('reference_id') for row in p12.get('selected', []))
          p2_resolved = [by_id[target_id] for target_id in resolved_ids if target_id in by_id and by_id[target_id].get('priority') == 'P2']
          p2_counts = Counter(row.get('madhhab') for row in p2_resolved)

          wave2 = json.loads(Path('/tmp/corpus_wave2_report.json').read_text(encoding='utf-8'))
          print('P2 resolved:', len(p2_resolved), '/', p12.get('optional_targets'))
          for madhhab in ('Ḥanafite', 'Mālikite', 'Shāfiʿite', 'Ḥanbalite'):
              print(f'  P2 {madhhab}: {p2_counts[madhhab]}')
          print('P3 resolved:', wave2['resolved_targets'], '/ 60; new books:', wave2['new_books'])
          for madhhab in ('Ḥanafite', 'Mālikite', 'Shāfiʿite', 'Ḥanbalite'):
              print(f"  P3 {madhhab}: resolved={wave2['resolved_by_madhhab'].get(madhhab, 0)}, new={wave2['new_books_by_madhhab'].get(madhhab, 0)}")
          print('P3 source types:', wave2.get('resolved_source_types'))
          if wave2.get('missing'):
              print('P3 unresolved targets:')
              for row in wave2['missing']:
                  print(' -', row['madhhab'], row['title'])

          assert p12['resolved'] == 13, p12
          assert not p12['missing'], p12['missing']
          for madhhab in ('Ḥanafite', 'Mālikite', 'Shāfiʿite', 'Ḥanbalite'):
              assert p2_counts[madhhab] >= 3, (madhhab, p2_counts[madhhab], p12.get('optional_missing'))
          assert len(p2_resolved) >= 16, p12
          assert wave2['targets'] == 60, wave2
          assert wave2['resolved_targets'] + len(wave2.get('missing') or []) == 60, wave2
          PY
