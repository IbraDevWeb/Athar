name: Corpus industrialization tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'rag/corpus_sources.json'
      - 'rag/corpus_policy.json'
      - 'rag/corpus_approval.json'
      - 'rag/corpus_reference_checklist.json'
      - 'rag/corpus_priority_targets.json'
      - 'rag/corpus_curation_rules.json'
      - 'rag/corpus_priority_ingest.py'
      - 'rag/corpus_priority_ingest_tests.py'
      - 'rag/corpus_curator.py'
      - 'rag/corpus_curator_tests.py'
      - 'rag/openiti_reader_tests.py'
      - 'rag/corpus_book_curation.json'
      - 'rag/openiti_books_priority.json'
      - 'rag/corpus_coverage_audit.py'
      - 'rag/corpus_coverage_audit_tests.py'
      - 'rag/openiti_catalog.py'
      - 'rag/corpus_candidate_guard.py'
      - 'rag/corpus_candidate_guard_tests.py'
      - 'rag/corpus_industrializer.py'
      - 'rag/corpus_industrializer_tests.py'
      - 'rag/corpus_shards.py'
      - 'rag/corpus_shards_tests.py'
      - 'rag/corpus_shards.json'
      - 'rag/openiti.py'
      - 'rag/openiti_books_auto.json'
      - 'rag/openiti_books_tafsir.json'
      - 'rag/ingest_openiti.py'
      - 'rag/build_hosted_corpus.py'
      - 'rag/build_sharded_corpus.py'
      - 'rag/cache_hosted_corpus.py'
      - 'rag/fetch_hosted_corpus.py'
      - 'rag/corpus_release_cache_tests.py'
      - 'rag/v5_sharded.py'
      - 'rag/v5_server.py'
      - 'rag/v5_library.py'
      - 'rag/v5_library_reader_tests.py'
      - 'rag/v5_library_server.py'
      - 'rag/sharded_corpus_tests.py'
      - '.github/workflows/grow-openiti-corpus.yml'
      - '.github/workflows/curate-athar-corpus.yml'
      - '.github/workflows/build-rag-corpus.yml'
      - '.github/workflows/corpus-coverage-audit.yml'
      - '.github/workflows/corpus-industrialization-tests.yml'
  push:
    branches: [main]
    paths:
      - 'rag/corpus_sources.json'
      - 'rag/corpus_policy.json'
      - 'rag/corpus_approval.json'
      - 'rag/corpus_reference_checklist.json'
      - 'rag/corpus_priority_targets.json'
      - 'rag/corpus_curation_rules.json'
      - 'rag/corpus_priority_ingest.py'
      - 'rag/corpus_priority_ingest_tests.py'
      - 'rag/corpus_curator.py'
      - 'rag/corpus_curator_tests.py'
      - 'rag/openiti_reader_tests.py'
      - 'rag/corpus_book_curation.json'
      - 'rag/openiti_books_priority.json'
      - 'rag/corpus_coverage_audit.py'
      - 'rag/corpus_coverage_audit_tests.py'
      - 'rag/openiti_catalog.py'
      - 'rag/corpus_candidate_guard.py'
      - 'rag/corpus_candidate_guard_tests.py'
      - 'rag/corpus_industrializer.py'
      - 'rag/corpus_industrializer_tests.py'
      - 'rag/corpus_shards.py'
      - 'rag/corpus_shards_tests.py'
      - 'rag/corpus_shards.json'
      - 'rag/openiti.py'
      - 'rag/openiti_books_auto.json'
      - 'rag/openiti_books_tafsir.json'
      - 'rag/ingest_openiti.py'
      - 'rag/build_hosted_corpus.py'
      - 'rag/build_sharded_corpus.py'
      - 'rag/cache_hosted_corpus.py'
      - 'rag/fetch_hosted_corpus.py'
      - 'rag/corpus_release_cache_tests.py'
      - 'rag/v5_sharded.py'
      - 'rag/v5_server.py'
      - 'rag/v5_library.py'
      - 'rag/v5_library_reader_tests.py'
      - 'rag/v5_library_server.py'
      - 'rag/sharded_corpus_tests.py'
      - '.github/workflows/grow-openiti-corpus.yml'
      - '.github/workflows/curate-athar-corpus.yml'
      - '.github/workflows/build-rag-corpus.yml'
      - '.github/workflows/corpus-coverage-audit.yml'
      - '.github/workflows/corpus-industrialization-tests.yml'
  workflow_dispatch:

jobs:
  industrialization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r rag/requirements.txt
      - name: Compile industrial corpus modules
        run: >-
          python -m py_compile
          rag/openiti.py
          rag/openiti_catalog.py
          rag/corpus_priority_ingest.py
          rag/corpus_priority_ingest_tests.py
          rag/corpus_curator.py
          rag/corpus_curator_tests.py
          rag/openiti_reader_tests.py
          rag/corpus_candidate_guard.py
          rag/corpus_candidate_guard_tests.py
          rag/corpus_industrializer.py
          rag/corpus_shards.py
          rag/corpus_shards_tests.py
          rag/corpus_coverage_audit.py
          rag/corpus_coverage_audit_tests.py
          rag/ingest_openiti.py
          rag/build_hosted_corpus.py
          rag/build_sharded_corpus.py
          rag/cache_hosted_corpus.py
          rag/fetch_hosted_corpus.py
          rag/v5_sharded.py
          rag/v5_server.py
          rag/v5_library.py
          rag/v5_library_reader_tests.py
          rag/v5_library_server.py
          rag/corpus_industrializer_tests.py
          rag/corpus_release_cache_tests.py
          rag/sharded_corpus_tests.py
      - name: Run deterministic catalogue, curation, sharding and coverage tests
        working-directory: rag
        run: |
          python corpus_priority_ingest_tests.py
          python corpus_curator_tests.py
          python openiti_reader_tests.py
          python v5_library_reader_tests.py
          python corpus_industrializer_tests.py
          python corpus_candidate_guard_tests.py
          python corpus_shards_tests.py
          python corpus_coverage_audit_tests.py
      - name: Generate coverage audit as a smoke test
        run: python rag/corpus_coverage_audit.py --json /tmp/corpus_coverage_audit.json --markdown /tmp/CORPUS_COVERAGE.md
      - name: Run compressed release cache tests
        working-directory: rag
        run: python corpus_release_cache_tests.py
      - name: Run sharded runtime and cache tests
        working-directory: rag
        run: python sharded_corpus_tests.py
      - name: Validate industrial manifest invariants
        shell: bash
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path
          sys.path.insert(0, 'rag')
          from ingest_openiti import load_industrialized_manifest
          from corpus_shards import build_registry, load_shardable_manifest
          policy = json.loads(Path('rag/corpus_policy.json').read_text(encoding='utf-8'))
          sources = json.loads(Path('rag/corpus_sources.json').read_text(encoding='utf-8'))
          approval = json.loads(Path('rag/corpus_approval.json').read_text(encoding='utf-8'))
          auto = json.loads(Path('rag/openiti_books_auto.json').read_text(encoding='utf-8'))
          checklist = json.loads(Path('rag/corpus_reference_checklist.json').read_text(encoding='utf-8'))
          targets = json.loads(Path('rag/corpus_priority_targets.json').read_text(encoding='utf-8'))
          assert sources['sources']['kutub']['automation_policy'] == 'respect_robots'
          assert int(policy['hosted']['target_openiti_books']) >= int(policy['hosted']['minimum_openiti_books'])
          assert int(policy['hosted']['expected_openiti_books_after_tafsir']) >= int(policy['hosted']['target_openiti_books'])
          assert int(policy['hosted']['max_sqlite_bytes']) > 0
          assert policy['sharding']['enabled'] is True
          assert policy['curation']['freeze_generic_growth'] is True
          assert policy['curation']['priority_only_growth'] is True
          assert int(policy['curation']['required_priority_p1']) == 13
          assert policy['curation']['reader_parser_version'] == 'athar-openiti-reader-v2'
          assert int(policy['sharding']['future_target_books']) >= 500
          assert len(checklist.get('works', [])) >= 40
          assert len(targets.get('targets', [])) == 13
          assert all(item.get('work_markers') for item in targets.get('targets', []))
          assert all(item.get('priority') == 'P1' for item in targets.get('targets', []))
          assert all(not str(book.get('madhhab') or '').strip() for book in auto.get('books', []))
          approved_blob = str(approval.get('approved_auto_manifest_blob') or '')
          assert not approved_blob or re.fullmatch(r'[0-9a-f]{40}', approved_blob)
          industrial = load_industrialized_manifest()
          industrial_ids = [str(book['book_id']) for book in industrial['books'] if book.get('enabled', True)]
          industrial_uris = [str(book['openiti_uri']) for book in industrial['books'] if book.get('enabled', True)]
          assert len(industrial_ids) == len(set(industrial_ids)); assert len(industrial_uris) == len(set(industrial_uris))
          shardable = load_shardable_manifest()
          ids = [str(book['book_id']) for book in shardable['books'] if book.get('enabled', True)]
          uris = [str(book['openiti_uri']) for book in shardable['books'] if book.get('enabled', True)]
          assert len(ids) == len(set(ids)); assert len(uris) == len(set(uris)); assert len(ids) >= len(industrial_ids)
          registry = build_registry(shardable, policy)
          assert registry['total_books'] == len(ids); assert set(registry['book_to_shard']) == set(ids)
          assert all(int(shard['book_count']) <= int(registry['limits']['max_books_per_shard']) for shard in registry['shards'])
          print(f'Industrial manifest valid: {len(industrial_ids)} industrial + {len(ids) - len(industrial_ids)} dedicated = {len(ids)} shardable OpenITI books, {registry["total_shards"]} planned shard(s)')
          PY
