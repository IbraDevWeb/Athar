name: Kutub parser tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rag/scrape_kutub.py'
      - 'rag/scrape_kutub_tests.py'
      - 'rag/ingest_kutub.py'
      - '.github/workflows/kutub-parser-tests.yml'
  push:
    branches: [main]
    paths:
      - 'rag/scrape_kutub.py'
      - 'rag/scrape_kutub_tests.py'
      - 'rag/ingest_kutub.py'
      - '.github/workflows/kutub-parser-tests.yml'

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Compile Kutub pipeline
        run: python -m py_compile rag/scrape_kutub.py rag/ingest_kutub.py rag/scrape_kutub_tests.py

      - name: Run Kutub French extraction tests
        working-directory: rag
        run: python scrape_kutub_tests.py
