name: Repair Athar V39-safe-2 validators

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/athar-v39-v2-validator-fix.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Make cache validation suffix-aware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/validate-interactions.js')
          text = p.read_text(encoding='utf-8')
          old = """const configVersion = Number(source.config.match(/const APP_VERSION = 'athar-pro-v(\\d+)'/)?.[1] || 0);
          const workerVersion = Number(source.worker.match(/const CACHE_VERSION = 'athar-pro-v(\\d+)'/)?.[1] || 0);
          if (configVersion !== workerVersion || configVersion < 27) {
              fail(`inconsistent or stale application cache: config v${configVersion}, worker v${workerVersion}`);
          }

          for (const asset of [
              `css/interaction-stability.css?v=athar-pro-v${workerVersion}`,
              `js/components/VueSafeIcons.js?v=athar-pro-v${workerVersion}`,
              `js/components/TransmissionView.js?v=athar-pro-v${workerVersion}`
          ]) {"""
          new = """const configVersion = source.config.match(/const APP_VERSION = '([^']+)'/)?.[1] || '';
          const workerVersion = source.worker.match(/const CACHE_VERSION = '([^']+)'/)?.[1] || '';
          const configMajor = Number(configVersion.match(/^athar-pro-v(\\d+)/)?.[1] || 0);
          const validVersion = /^athar-pro-v\\d+(?:-[a-z0-9-]+)*$/i.test(configVersion);
          if (!validVersion || configVersion !== workerVersion || configMajor < 27) {
              fail(`inconsistent or stale application cache: config ${configVersion || 'missing'}, worker ${workerVersion || 'missing'}`);
          }

          for (const asset of [
              `css/interaction-stability.css?v=${workerVersion}`,
              `js/components/VueSafeIcons.js?v=${workerVersion}`,
              `js/components/TransmissionView.js?v=${workerVersion}`
          ]) {"""
          if old not in text:
              raise SystemExit('validate-interactions version block not found')
          text = text.replace(old, new, 1)
          text = text.replace('and cache v${workerVersion}.', 'and cache ${workerVersion}.')
          p.write_text(text, encoding='utf-8')

          p = Path('scripts/validate-rag-v4.js')
          text = p.read_text(encoding='utf-8')
          if 'athar-pro-v39-safe-1' not in text:
              raise SystemExit('stale Research validator token not found')
          text = text.replace('athar-pro-v39-safe-1', 'athar-pro-v39-safe-2')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate repaired guards
        run: |
          node --check scripts/validate-interactions.js
          node --check scripts/validate-rag-v4.js
          node scripts/validate-interactions.js
          node scripts/validate-rag-v4.js

      - name: Commit repaired validators
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-interactions.js scripts/validate-rag-v4.js
          git commit -m 'Make validators compatible with Athar UX v39 safe v2'
          git push origin HEAD:main
