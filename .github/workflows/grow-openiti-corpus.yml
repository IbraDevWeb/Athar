name: Grow OpenITI corpus

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Nombre maximal de nouveaux ouvrages à promouvoir après réouverture de la croissance
        required: false
        default: '25'
      confirm_resume_generic_growth:
        description: Saisir YES uniquement après la fin de la phase de curation quality-first
        required: true
        default: 'NO'

permissions:
  contents: write

concurrency:
  group: grow-openiti-corpus
  cancel-in-progress: false

jobs:
  grow:
    if: github.repository == 'IbraDevWeb/Athar'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Enforce quality-first freeze
        shell: bash
        env:
          CONFIRM_RESUME: ${{ inputs.confirm_resume_generic_growth }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('rag/corpus_policy.json').read_text(encoding='utf-8'))
          curation = policy.get('curation') or {}
          if curation.get('freeze_generic_growth', False):
              raise SystemExit(
                  'Croissance générique gelée par corpus_policy.json : '
                  'terminer la curation des ouvrages actuels et des priorités P1 avant de densifier.'
              )
          if os.environ.get('CONFIRM_RESUME') != 'YES':
              raise SystemExit('Confirmation YES requise pour reprendre la croissance générique.')
          print('Generic growth explicitly reopened.')
          PY

      - name: Validate industrialization logic
        working-directory: rag
        run: |
          python corpus_industrializer_tests.py
          python corpus_candidate_guard_tests.py
          python corpus_shards_tests.py

      - name: Refresh OpenITI scholarly catalogue
        run: python rag/openiti_catalog.py --output /tmp/openiti_catalog.json

      - name: Apply scholarly candidate guard
        run: >-
          python rag/corpus_candidate_guard.py
          --input /tmp/openiti_catalog.json
          --output /tmp/openiti_catalog_guarded.json

      - name: Resolve batch size
        id: batch
        shell: bash
        run: |
          BATCH="${{ inputs.batch_size }}"
          if ! [[ "$BATCH" =~ ^[0-9]+$ ]]; then BATCH=25; fi
          if (( BATCH < 1 )); then BATCH=1; fi
          if (( BATCH > 25 )); then BATCH=25; fi
          echo "value=$BATCH" >> "$GITHUB_OUTPUT"

      - name: Promote only the books missing from the configured milestone
        run: >-
          python rag/corpus_industrializer.py
          --catalog /tmp/openiti_catalog_guarded.json
          --batch-size ${{ steps.batch.outputs.value }}
          --manifest rag/openiti_books_auto.json
          --report rag/corpus_growth_report.json

      - name: Generate deterministic shard registry
        run: python rag/corpus_shards.py --output rag/corpus_shards.json

      - name: Validate promoted manifest and shard routing
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'rag')
          from corpus_shards import load_shardable_manifest
          policy = json.loads(Path('rag/corpus_policy.json').read_text(encoding='utf-8'))
          auto = json.loads(Path('rag/openiti_books_auto.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('rag/corpus_shards.json').read_text(encoding='utf-8'))
          ids = [str(book.get('book_id') or '') for book in auto.get('books', [])]
          uris = [str(book.get('openiti_uri') or '') for book in auto.get('books', [])]
          assert all(ids) and len(ids) == len(set(ids)), 'duplicate automatic book ids'
          assert all(uris) and len(uris) == len(set(uris)), 'duplicate automatic OpenITI URIs'
          assert all(not str(book.get('madhhab') or '').strip() for book in auto.get('books', [])), 'automatic pipeline must not invent madhhab'
          manifest = load_shardable_manifest()
          enabled = [book for book in manifest.get('books', []) if isinstance(book, dict) and book.get('enabled', True)]
          enabled_ids = {str(book['book_id']) for book in enabled}
          assert registry['total_books'] == len(enabled_ids)
          assert set(registry['book_to_shard']) == enabled_ids
          assert all(len(shard.get('books') or []) <= int(registry['limits']['max_books_per_shard']) for shard in registry['shards'])
          print(f'Shardable OpenITI manifest: {len(enabled)} books; {len(ids)} auto-promoted; {registry["total_shards"]} shard(s)')
          PY

      - name: Commit staged promotion queue and shard registry
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- rag/openiti_books_auto.json rag/corpus_growth_report.json rag/corpus_shards.json)" ]]; then
            echo "Aucune nouvelle promotion."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rag/openiti_books_auto.json rag/corpus_growth_report.json rag/corpus_shards.json
          git commit -m "Préparer le prochain lot OpenITI et ses shards"
          git push origin HEAD:main
          echo "Lot préparé. La publication exige une approbation explicite du blob openiti_books_auto.json."
