name: Athar RAG V6.5.3 conn32 equivalence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rag-v653-conn32.yml'

concurrency:
  group: rag-v653-conn32
  cancel-in-progress: true

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: rag
      ATHAR_QUERY_LLM_ENABLED: '0'
      GEMINI_API_KEY: ''
      FASTEMBED_CACHE_PATH: rag/data/fastembed-cache
      ATHAR_FASTEMBED_LOCAL_ONLY: '1'
      ATHAR_ANN_VERIFY_SHA: '1'
      ATHAR_SEMANTIC_TOKEN: v653-conn32-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r rag/requirements-v64.txt

      - name: Compile
        run: >-
          python -m py_compile rag/v653_sharded_ann.py rag/v653_semantic_server.py
          rag/v653_sharded_benchmark.py rag/v651_remote_smoke.py

      - name: Resolve semantic source
        id: semantic
        shell: bash
        run: |
          RUN_ID=$(gh run list --workflow rag-v63-build-semantic-index.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download semantic source
        uses: actions/download-artifact@v4
        with:
          name: athar-v63-semantic-release
          path: rag/data/v63-semantic-release
          github-token: ${{ github.token }}
          repository: IbraDevWeb/Athar
          run-id: ${{ steps.semantic.outputs.run_id }}

      - name: Build sharded f16 conn32
        run: >-
          python rag/v653_sharded_ann.py build
          --corpus-manifest rag/corpus_release_v3.json
          --semantic-index-dir rag/data/v63-semantic-release
          --output-dir rag/data/v653-ann
          --connectivity 32 --expansion-add 256 --expansion-search 1024 --batch-size 8192

      - name: Validate footprint
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ann=json.loads(Path('rag/data/v653-ann/athar-v653-sharded.ann.json').read_text(encoding='utf-8'))
          assert int(ann['connectivity']) == 32, ann
          assert int(ann['vectors']) == 574461, ann
          largest=int(ann['largest_shard_index_bytes'])
          total=int(ann['index_size_bytes'])+int(ann['metadata_size_bytes'])
          assert largest < 120_000_000, largest
          assert total < 700_000_000, total
          print(json.dumps({'largest_live_shard_bytes':largest,'total_disk_bytes':total},indent=2))
          PY

      - name: Cache model
        run: >-
          python rag/cache_fastembed_model.py --model sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 --cache-dir rag/data/fastembed-cache

      - name: Generate dataset
        run: python rag/benchmark_v61_dataset.py --output rag/data/benchmark-v61.json

      - name: Cache corpus
        run: >-
          python rag/cache_hosted_corpus.py --manifest rag/corpus_release_v3.json --output-dir rag/data/v653-shards

      - name: Dense exact quality gate
        run: >-
          python rag/v653_sharded_benchmark.py
          --dataset rag/data/benchmark-v61.json --manifest rag/corpus_release_v3.json
          --shard-dir rag/data/v653-shards --semantic-index-dir rag/data/v63-semantic-release
          --ann-manifest rag/data/v653-ann/athar-v653-sharded.ann.json
          --candidate-limit 20 --ann-limit 40 --ann-oversample 160
          --ann-recall-cases 30 --ann-recall-k 10 --min-ann-recall 0.95
          --output-json rag/data/benchmark-v653-conn32.json --fail-on-regression

      - name: Cache accepted global f16 ANN
        run: >-
          python rag/cache_v63c_ann_release.py --corpus-manifest rag/corpus_release_v3.json --output-dir rag/data/v63c-ann

      - name: Exact 200-case fused equivalence
        shell: bash
        env:
          ATHAR_ANN_MANIFEST: rag/data/v63c-ann/athar-v63c-global.ann.json
        run: |
          set -euo pipefail
          python rag/v653_semantic_server.py --host 127.0.0.1 --port 8765 --ann-manifest rag/data/v653-ann/athar-v653-sharded.ann.json > rag/data/v653-conn32-semantic.log 2>&1 &
          PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json,time,urllib.request
          for _ in range(180):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/healthz',timeout=5) as r: p=json.load(r)
                  if p.get('ready') and int(p.get('ann_vectors') or 0)==574461:
                      print(p); break
              except Exception: pass
              time.sleep(1)
          else: raise SystemExit('sidecar not ready')
          PY
          python rag/v651_remote_smoke.py --dataset rag/data/benchmark-v61.json --manifest rag/corpus_release_v3.json --shard-dir rag/data/v653-shards --ann-manifest rag/data/v63c-ann/athar-v63c-global.ann.json --semantic-url http://127.0.0.1:8765 --semantic-token "$ATHAR_SEMANTIC_TOKEN" --output-json rag/data/benchmark-v653-conn32-equivalence.json --output-md rag/data/BENCHMARK_V653_CONN32_EQUIVALENCE.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athar-rag-v653-conn32
          path: |
            rag/data/benchmark-v653-conn32.json
            rag/data/benchmark-v653-conn32-equivalence.json
            rag/data/BENCHMARK_V653_CONN32_EQUIVALENCE.md
            rag/data/v653-ann/athar-v653-sharded.ann.json
            rag/data/v653-conn32-semantic.log
          if-no-files-found: warn
          retention-days: 90
