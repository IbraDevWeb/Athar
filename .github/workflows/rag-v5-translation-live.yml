name: RAG V5 scholar translation live probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rag-v5-translation-live.yml'

jobs:
  translate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for translation endpoint on Render
        run: |
          python - <<'PY'
          import json, time, urllib.error, urllib.request

          url = 'https://athar-rag-ibradevweb.onrender.com/api/rag/v5/translate'
          body = json.dumps({}).encode('utf-8')
          last = None
          for attempt in range(1, 31):
              request = urllib.request.Request(
                  url,
                  data=body,
                  method='POST',
                  headers={
                      'Origin': 'https://ibradevweb.github.io',
                      'Accept': 'application/json',
                      'Content-Type': 'application/json; charset=utf-8',
                      'Cache-Control': 'no-cache',
                      'User-Agent': 'Athar-Translation-live-probe',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      last = (response.status, response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  payload = exc.read().decode('utf-8', errors='replace')
                  last = (exc.code, payload)
                  print('Attempt', attempt, '=>', exc.code, payload, flush=True)
                  validation_error = (
                      'Identifiant de passage requis' in payload
                      or "Identifiant d'ouvrage requis" in payload
                  )
                  if exc.code == 400 and validation_error:
                      print('PUBLIC ATHAR TRANSLATION ROUTE: READY')
                      raise SystemExit(0)
              except Exception as exc:
                  last = repr(exc)
                  print('Attempt', attempt, '=>', repr(exc), flush=True)
              time.sleep(15)
          raise SystemExit(f'Translation endpoint did not become ready: {last}')
          PY

      - name: Translate one indexed Arabic passage with Gemini
        run: |
          python - <<'PY'
          import json, re, time, urllib.error, urllib.parse, urllib.request

          base = 'https://athar-rag-ibradevweb.onrender.com'
          query = "Que dit le Muwatta sur la prière de l'éclipse ?"
          search_url = base + '/api/rag/v5/search?' + urllib.parse.urlencode({'q': query, 'limit': 3})
          search_request = urllib.request.Request(
              search_url,
              headers={
                  'Origin': 'https://ibradevweb.github.io',
                  'Accept': 'application/json',
                  'Cache-Control': 'no-cache',
                  'User-Agent': 'Athar-Translation-live-probe',
              },
          )
          with urllib.request.urlopen(search_request, timeout=90) as response:
              search = json.loads(response.read().decode('utf-8'))

          source = next(
              (item for item in search.get('sources') or [] if item.get('id') and item.get('book_id') and item.get('text_ar')),
              None,
          )
          if not source:
              raise SystemExit(f'No indexed Arabic source available for probe: {search}')

          request_body = json.dumps(
              {
                  'source_id': source['id'],
                  'book_id': source['book_id'],
                  'mode': 'faithful',
              },
              ensure_ascii=False,
          ).encode('utf-8')
          translate_url = base + '/api/rag/v5/translate'
          last = None
          for attempt in range(1, 4):
              request = urllib.request.Request(
                  translate_url,
                  data=request_body,
                  method='POST',
                  headers={
                      'Origin': 'https://ibradevweb.github.io',
                      'Accept': 'application/json',
                      'Content-Type': 'application/json; charset=utf-8',
                      'Cache-Control': 'no-cache',
                      'User-Agent': 'Athar-Translation-live-probe',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  translation = payload.get('translation') or {}
                  text = str(translation.get('text_fr') or '').strip()
                  print(
                      'Translation metadata:',
                      {
                          'mode': translation.get('mode'),
                          'status': translation.get('status'),
                          'provider': translation.get('provider'),
                          'model': translation.get('model'),
                          'latency_ms': translation.get('latency_ms'),
                          'cache_hit': translation.get('cache_hit'),
                          'terms': len(translation.get('terms') or []),
                          'uncertainties': len(translation.get('uncertainties') or []),
                      },
                      flush=True,
                  )
                  assert payload.get('engine') == 'rag-v5-hybrid-multilingual', payload
                  assert translation.get('mode') == 'faithful', translation
                  assert translation.get('provider') == 'google-gemini', translation
                  assert translation.get('status') == 'Traduction assistée par IA — non vérifiée', translation
                  assert text and re.search(r'[A-Za-zÀ-ÖØ-öø-ÿ]', text), translation
                  returned_source = payload.get('source') or {}
                  assert returned_source.get('id') == source['id'], returned_source
                  assert returned_source.get('book_id') == source['book_id'], returned_source
                  print('PUBLIC ATHAR SCHOLAR TRANSLATION: PASS — indexed source, Gemini, non-verified label')
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  last = (exc.code, body)
                  print('Translation attempt', attempt, '=>', exc.code, body, flush=True)
                  if exc.code not in {429, 503, 504}:
                      raise
              except Exception as exc:
                  last = repr(exc)
                  print('Translation attempt', attempt, '=>', repr(exc), flush=True)
              if attempt < 3:
                  time.sleep(55)
          raise SystemExit(f'Live scholar translation did not succeed: {last}')
          PY
