name: RAG production diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/rag-production-diagnostic.yml'
      - 'js/rag-fetch-resilience.js'
      - 'js/config.js'
      - 'scripts/rag_fetch_resilience_test.mjs'
      - 'scripts/rag_production_smoke.py'
      - 'render.yaml'
  workflow_dispatch:

jobs:
  production-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Capture first public response
        shell: bash
        run: |
          set +e
          base='https://athar-rag-ibradevweb.onrender.com'
          curl -sS --max-time 30 \
            -H 'Origin: https://ibradevweb.github.io' \
            -H 'Cache-Control: no-cache' \
            -D /tmp/athar-first.headers \
            -o /tmp/athar-first.body \
            -w 'curl_http_code=%{http_code}\ncurl_total_time=%{time_total}\n' \
            "$base/healthz?diagnostic=${GITHUB_RUN_ID}" >/tmp/athar-first.meta
          rc=$?
          echo "curl_exit=$rc"
          cat /tmp/athar-first.meta || true
          echo '--- headers ---'
          cat /tmp/athar-first.headers || true
          echo '--- body ---'
          head -c 2000 /tmp/athar-first.body || true
          echo
          exit 0

      - name: Wait for public RAG to become healthy
        shell: bash
        run: |
          set -euo pipefail
          base='https://athar-rag-ibradevweb.onrender.com'
          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 20 \
              -H 'Origin: https://ibradevweb.github.io' \
              -H 'Cache-Control: no-cache' \
              "$base/healthz?wake=${GITHUB_RUN_ID}-${attempt}" \
              -o /tmp/athar-health.json; then
              if python - <<'PY'
          import json
          p=json.load(open('/tmp/athar-health.json', encoding='utf-8'))
          assert p.get('ok') is True, p
          assert int(p.get('engine_version') or 0) >= 6, p
          print('healthy engine=', p.get('engine'))
          PY
              then
                echo "RAG healthy on attempt $attempt"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Public RAG did not become healthy within 3 minutes.'
          exit 1

      - name: Verify browser CORS and current corpus
        shell: bash
        run: |
          set -euo pipefail
          base='https://athar-rag-ibradevweb.onrender.com'
          curl -fsS --max-time 30 \
            -H 'Origin: https://ibradevweb.github.io' \
            -D /tmp/athar-status.headers \
            "$base/api/rag/v5/status?diagnostic=${GITHUB_RUN_ID}" \
            -o /tmp/athar-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          headers=Path('/tmp/athar-status.headers').read_text(encoding='utf-8', errors='replace').lower()
          assert 'access-control-allow-origin: https://ibradevweb.github.io' in headers, headers
          p=json.load(open('/tmp/athar-status.json', encoding='utf-8'))
          assert p.get('ok') is True, p
          assert int(p.get('openiti_books') or 0) >= 267, p
          assert int(p.get('books') or 0) >= 269, p
          assert int(p.get('chunks') or 0) >= 786395, p
          print('status ok:', {k:p.get(k) for k in ('engine','books','openiti_books','chunks','shards')})
          PY

      - name: Verify real retrieval beyond S12
        shell: bash
        run: |
          set -euo pipefail
          base='https://athar-rag-ibradevweb.onrender.com'
          curl -fsS --max-time 150 \
            -H 'Origin: https://ibradevweb.github.io' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"query":"Que disent les sources du corpus sur la prière ?","limit":8}' \
            "$base/api/rag/v5/ask" \
            -o /tmp/athar-ask.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/athar-ask.json', encoding='utf-8'))
          assert p.get('ok') is True, p
          sources=p.get('sources') or []
          ids=[s.get('citation_id') for s in sources]
          assert len(sources) >= 13, len(sources)
          assert 'S13' in ids, ids
          print('retrieval ok:', len(sources), 'sources, last=', ids[-1])
          PY
