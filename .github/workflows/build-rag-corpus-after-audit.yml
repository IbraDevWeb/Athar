name: Build RAG corpus after audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rag-corpus-after-audit.yml'
  workflow_run:
    workflows: ['Corpus coverage audit']
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: athar-rag-post-audit-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'Publier le corpus Athar curaté sharded V3'))
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch stabilized V3 build on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-rag-corpus.yml --ref main -R "$GITHUB_REPOSITORY"
          echo 'Build hosted RAG corpus dispatched after the coverage audit / synchronization change.'
