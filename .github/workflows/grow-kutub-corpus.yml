name: Grow Kutub corpus

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Pages à tenter par ouvrage si Kutub autorise le crawl
        required: false
        default: '2'
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'rag/books.json'
      - 'rag/prepare_hosted_db.py'
      - 'rag/export_kutub_corpus.py'
      - '.github/workflows/grow-kutub-corpus.yml'

permissions:
  contents: write

concurrency:
  group: grow-kutub-corpus
  cancel-in-progress: false

jobs:
  grow:
    if: github.repository == 'IbraDevWeb/Athar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Hydrate versioned corpus
        run: python rag/prepare_hosted_db.py --db /tmp/athar-kutub-grow.sqlite

      - name: Check Kutub automated-access policy
        id: policy
        shell: bash
        env:
          ATHAR_BOT_CONTACT: https://github.com/IbraDevWeb/Athar
        run: |
          set +e
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'rag')
          from scrape_kutub import robots_policy

          contact = os.environ.get('ATHAR_BOT_CONTACT', 'operator-contact-not-configured')
          user_agent = f"AtharResearchBot/3.0 (+{contact}; public pages; respectful rate limit)"
          try:
              robots_policy(user_agent)
          except Exception as error:
              print(f"Kutub automated access unavailable: {error}")
              raise SystemExit(2)
          print("Kutub robots.txt autorise actuellement AtharResearchBot sur les pages de livres.")
          PY
          RESULT=$?
          if [[ "$RESULT" -eq 0 ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Select respectful batch size
        if: steps.policy.outputs.allowed == 'true'
        id: batch
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            BATCH=1
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            BATCH="${{ inputs.batch_size }}"
          else
            BATCH=2
          fi
          if ! [[ "$BATCH" =~ ^[0-9]+$ ]]; then BATCH=2; fi
          if (( BATCH < 1 )); then BATCH=1; fi
          if (( BATCH > 5 )); then BATCH=5; fi
          echo "value=$BATCH" >> "$GITHUB_OUTPUT"

      - name: Crawl next public Kutub pages
        if: steps.policy.outputs.allowed == 'true'
        env:
          ATHAR_BOT_CONTACT: https://github.com/IbraDevWeb/Athar
        run: >-
          python rag/ingest_kutub.py sync
          --db /tmp/athar-kutub-grow.sqlite
          --batch-size ${{ steps.batch.outputs.value }}
          --delay 1.75
          --json

      - name: Explain Kutub robots policy
        if: steps.policy.outputs.allowed != 'true'
        run: |
          echo "Kutub robots.txt interdit actuellement l'exploration automatisée des pages de livres."
          echo "Athar ne tente aucun contournement. Le workflow reverifiera cette autorisation lors de la prochaine exécution."

      - name: Export durable Kutub snapshot
        run: >-
          python rag/export_kutub_corpus.py
          --db /tmp/athar-kutub-grow.sqlite
          --output rag/kutub_corpus.json
          --max-mib 20

      - name: Commit catalogue or corpus growth
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- rag/kutub_corpus.json)" ]]; then
            echo "Aucun changement Kutub à versionner."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rag/kutub_corpus.json
          git commit -m "Enrichir progressivement le corpus Kutub"
          git push origin HEAD:main
