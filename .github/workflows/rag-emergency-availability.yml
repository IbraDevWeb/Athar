name: Athar emergency public availability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rag-emergency-availability.yml'

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check public health
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          url='https://athar-rag-ibradevweb.onrender.com/healthz'
          last=None
          for attempt in range(1,31):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Athar-emergency-availability'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      payload=json.load(r)
                  print(json.dumps(payload,ensure_ascii=False,indent=2),flush=True)
                  if payload.get('ok'):
                      break
              except Exception as exc:
                  last=repr(exc); print(attempt,last,flush=True)
              time.sleep(10)
          else:
              raise SystemExit(f'public health unavailable: {last}')
          PY

      - name: Check public RAG with fail-open accepted
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request
          payload={'query':'Quelles sont les règles du tayammum ?','limit':5}
          req=urllib.request.Request('https://athar-rag-ibradevweb.onrender.com/api/rag/v5/ask',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','Origin':'https://ibradevweb.github.io','Cache-Control':'no-cache','User-Agent':'Athar-emergency-availability'},method='POST')
          with urllib.request.urlopen(req,timeout=120) as r:
              result=json.load(r); cors=r.headers.get('Access-Control-Allow-Origin')
          analysis=result.get('analysis') or {}; sources=result.get('sources') or []
          print(json.dumps({'engine':result.get('engine'),'sources':len(sources),'fallback':analysis.get('semantic_remote_fallback'),'remote_available':analysis.get('semantic_remote_available')},ensure_ascii=False,indent=2))
          assert cors=='https://ibradevweb.github.io',cors
          assert sources, result
          print('PUBLIC ATHAR RESEARCH AVAILABLE')
          PY
