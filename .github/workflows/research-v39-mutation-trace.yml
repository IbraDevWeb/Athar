name: Athar Research V39 mutation trace

on:
  push:
    branches: ['fix/research-v39-blank']
    paths:
      - 'scripts/research_v39_mutation_trace.mjs'
      - '.github/workflows/research-v39-mutation-trace.yml'
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/research-v39-blank
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/apply_ux_v39_safe.py
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/athar-trace.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - env:
          ATHAR_E2E_BASE: http://127.0.0.1:4173
        run: node scripts/research_v39_mutation_trace.mjs
