name: RAG V5 library live verification

on:
  push:
    branches: [main]
    paths:
      - 'rag/v5_library.py'
      - 'rag/v5_library_server.py'
      - 'rag/corpus_release.json'
      - 'research-library.html'
      - 'js/research-library-v2.js'
      - 'css/research-library-v2.css'
      - 'render.yaml'
      - '.github/workflows/rag-v5-library-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-library-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout expected corpus manifest
        uses: actions/checkout@v4

      - name: Wait for professional library reader API and expected corpus
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = 'https://athar-rag-ibradevweb.onrender.com'
          release = json.loads(Path('rag/corpus_release.json').read_text(encoding='utf-8'))
          expected_books = int(release.get('books') or 0)
          expected_chunks = int(release.get('chunks') or 0)
          expected_openiti = int(release.get('openiti_books') or 0)
          if expected_books <= 0 or expected_chunks <= 0:
              raise SystemExit(f'Invalid expected corpus manifest: {release}')

          last_error = None
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base + '/healthz', timeout=20) as response:
                      health = json.load(response)
                  if health.get('engine') != 'rag-v5-hybrid-multilingual':
                      raise RuntimeError(f"unexpected engine: {health}")

                  with urllib.request.urlopen(base + '/api/rag/v5/status', timeout=90) as response:
                      status = json.load(response)
                  served_books = int(status.get('books') or status.get('book_count') or 0)
                  served_chunks = int(status.get('chunks') or status.get('chunk_count') or 0)
                  if served_books < expected_books or served_chunks < expected_chunks:
                      raise RuntimeError(
                          f'corpus release not deployed yet: served={served_books} books/{served_chunks} chunks; '
                          f'expected>={expected_books}/{expected_chunks}'
                      )

                  with urllib.request.urlopen(base + '/api/rag/v5/library-books', timeout=90) as response:
                      catalogue = json.load(response)
                  rows = catalogue.get('books') or []
                  if len(rows) < expected_books:
                      raise RuntimeError(f'library catalogue still serves {len(rows)} books; expected >= {expected_books}')
                  if 'french_passages' not in rows[0] or 'indexed_sections' not in rows[0]:
                      raise RuntimeError('professional library catalogue is not deployed yet')

                  book_id = str(rows[0].get('id') or '').strip()
                  if not book_id:
                      raise RuntimeError('first production book has no id')
                  encoded = urllib.parse.quote(book_id)

                  with urllib.request.urlopen(base + '/api/rag/v5/book?id=' + encoded, timeout=90) as response:
                      info = json.load(response)
                  book = info.get('book') or {}
                  if info.get('engine') != 'rag-v5-hybrid-multilingual' or book.get('id') != book_id:
                      raise RuntimeError(f'book endpoint not ready: {info}')

                  with urllib.request.urlopen(base + '/api/rag/v5/toc?book_id=' + encoded + '&limit=5', timeout=90) as response:
                      toc = json.load(response)
                  if 'toc' not in toc or 'items' not in (toc.get('toc') or {}):
                      raise RuntimeError(f'toc endpoint invalid: {toc}')

                  page = book.get('first_page')
                  read_url = base + '/api/rag/v5/read?book_id=' + encoded + '&limit=2'
                  if page:
                      read_url += '&page=' + urllib.parse.quote(str(page))
                  with urllib.request.urlopen(read_url, timeout=90) as response:
                      read = json.load(response)
                  passages = read.get('passages') or []
                  if not passages or len(passages) > 2:
                      raise RuntimeError(f'invalid bounded reader payload: {read}')
                  if page and 'next_page' not in read:
                      raise RuntimeError('page-neighbor navigation is not deployed')

                  source_text = str(passages[0].get('text_ar') or passages[0].get('text_fr') or '')
                  words = re.findall(r'[\w\u0600-\u06FF]{3,}', source_text)
                  if words:
                      query = urllib.parse.quote(words[0])
                      search_url = base + '/api/rag/v5/book-search?book_id=' + encoded + '&limit=3&q=' + query
                      with urllib.request.urlopen(search_url, timeout=90) as response:
                          search = json.load(response)
                      if not search.get('hits'):
                          raise RuntimeError('book-scoped search returned no hit for a term taken from the passage')

                  print(
                      f"PUBLIC ATHAR LIBRARY: PASS — {len(rows)} books — {served_chunks} chunks — "
                      f"manifest expects {expected_books} books/{expected_chunks} chunks/{expected_openiti} OpenITI"
                  )
                  raise SystemExit(0)
              except Exception as error:
                  last_error = error
                  print(f'Attempt {attempt + 1}/30: {error}', flush=True)
                  time.sleep(20)
          raise SystemExit(f'Professional library reader/corpus did not become ready: {last_error}')
          PY
