name: Athar Research V6 end-to-end live check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/athar-research-v6-live-frontend.yml'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify deployed frontend assets and live synthesis
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          site = 'https://ibradevweb.github.io/Athar/'
          api = 'https://athar-rag-ibradevweb.onrender.com'

          def get(path):
              url = site + path
              req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','User-Agent':'Athar-V6-live-frontend'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return response.read().decode('utf-8')

          last = None
          for attempt in range(1, 31):
              try:
                  config = get(f'js/config.js?live={attempt}')
                  view = get(f'js/components/ScholarLibraryV4View.js?v=athar-research-v6-ui-1&live={attempt}')
                  bridge = get(f'js/components/ScholarSynthesisBridge.js?v=athar-research-v6-ui-1&live={attempt}')
                  worker = get(f'service-worker.js?live={attempt}')

                  assert "const RESEARCH_UI_VERSION = 'athar-research-v6-ui-1'" in config
                  assert 'const validateEngine = payload =>' in view
                  assert 'engineVersion < 5' in view
                  assert "payload?.engine !== 'rag-v5-hybrid-multilingual'" not in view
                  assert 'isCompatibleEngine' in bridge
                  assert 'engineVersion >= 5' in bridge
                  assert 'Le moteur de synthèse Athar V5 n’est pas disponible.' not in bridge
                  assert 'athar-research-v6-ui-1' in worker

                  body = json.dumps({
                      'query': 'Dans quelles prières récite-t-on à voix haute ?',
                      'limit': 8,
                      'madhhab': '',
                      'discipline': ''
                  }, ensure_ascii=False).encode('utf-8')
                  req = urllib.request.Request(
                      api + '/api/rag/v5/synthesize', data=body, method='POST',
                      headers={
                          'Accept':'application/json',
                          'Content-Type':'application/json; charset=utf-8',
                          'Origin':'https://ibradevweb.github.io',
                          'Cache-Control':'no-cache',
                          'User-Agent':'Athar-V6-live-frontend',
                      }
                  )
                  with urllib.request.urlopen(req, timeout=120) as response:
                      payload = json.load(response)
                  assert payload.get('ok') is True
                  assert int(payload.get('engine_version') or 0) >= 5
                  assert str(payload.get('engine') or '').lower().startswith(('rag-v','athar-v'))
                  assert payload.get('sources')
                  answer = payload.get('answer') or {}
                  assert answer.get('mode') == 'llm_grounded_synthesis', answer
                  assert (answer.get('synthesis') or {}).get('overview')

                  print(json.dumps({
                      'status':'PASS',
                      'frontend_version':'athar-research-v6-ui-1',
                      'engine':payload.get('engine'),
                      'engine_version':payload.get('engine_version'),
                      'sources':len(payload.get('sources') or []),
                      'synthesis':True,
                  }, ensure_ascii=False, indent=2))
                  print('ATHAR RESEARCH END-TO-END: PASS')
                  break
              except Exception as exc:
                  last = exc
                  print(f'Attempt {attempt}/30: {type(exc).__name__}: {exc}', flush=True)
                  if attempt == 30:
                      raise
                  time.sleep(10)
          else:
              raise RuntimeError(last or 'live verification failed')
          PY
