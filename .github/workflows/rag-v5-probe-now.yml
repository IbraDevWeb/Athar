name: Probe current public RAG engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/rag-v5-probe-now.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch health payload
        run: |
          python - <<'PY'
          import urllib.request
          req = urllib.request.Request('https://athar-rag-ibradevweb.onrender.com/healthz', headers={'Cache-Control':'no-cache','User-Agent':'Athar-probe'})
          with urllib.request.urlopen(req, timeout=60) as r:
              print(r.status)
              print(r.read().decode('utf-8'))
          PY
