name: RAG V4 clean tests

on:
  push:
    branches:
      - rag-v4-clean-rebuild
    paths:
      - 'rag/v4_*.py'
      - 'rag/cache_hosted_corpus.py'
      - 'rag/corpus_release.json'
      - '.github/workflows/rag-v4-tests.yml'
  workflow_dispatch:

concurrency:
  group: rag-v4-clean-rebuild
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile V4
        run: python -m py_compile rag/v4_engine.py rag/v4_server.py rag/v4_unit_tests.py rag/v4_corpus_tests.py

      - name: Run deterministic V4 tests
        working-directory: rag
        run: python v4_unit_tests.py

  real-corpus:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install corpus downloader dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Download published corpus
        run: python rag/cache_hosted_corpus.py --output rag/data/v4_test.sqlite

      - name: Verify corpus asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('rag/data/v4_test.sqlite')
          assert p.exists(), p
          assert p.read_bytes()[:16] == b'SQLite format 3\x00'
          print('SQLite bytes:', p.stat().st_size)
          PY

      - name: Run V4 against all real books
        working-directory: rag
        run: python v4_corpus_tests.py --db data/v4_test.sqlite
