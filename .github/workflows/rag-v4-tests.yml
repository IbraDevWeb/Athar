name: RAG V4 clean tests

on:
  push:
    branches:
      - rag-v4-clean-rebuild
    paths:
      - 'rag/v4_*.py'
      - '.github/workflows/rag-v4-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile V4
        run: python -m py_compile rag/v4_engine.py rag/v4_server.py rag/v4_unit_tests.py

      - name: Run deterministic V4 tests
        working-directory: rag
        run: python v4_unit_tests.py
