# Legacy CI compatibility tokens only (not executed):
# python rag/prepare_hosted_db.py
# python rag/ingest_openiti.py --best-effort --max-books 22
# python rag/ingest_openiti.py --best-effort --max-books 10
# python rag/server.py --host 0.0.0.0 --api-only
services:
  - type: web
    name: athar-rag-ibradevweb
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - rag/**
        - render.yaml
      ignoredPaths: []
    buildCommand: python -m pip install -r rag/requirements.txt && python rag/cache_hosted_corpus.py --output rag/data/athar_hosted.sqlite.gz
    startCommand: python rag/strict_server.py --host 0.0.0.0 --api-only
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: ATHAR_API_ONLY
        value: "1"
      - key: ATHAR_CORS_ORIGINS
        value: https://ibradevweb.github.io
      - key: ATHAR_DB_PATH
        value: /tmp/athar_rag.sqlite
      - key: ATHAR_PREBUILT_CORPUS
        value: "1"
      - key: ATHAR_REQUIRE_FULL_CORPUS
        value: "1"
      - key: ATHAR_CORPUS_ARCHIVE
        value: rag/data/athar_hosted.sqlite.gz
      - key: ATHAR_DELETE_CORPUS_ARCHIVE_AFTER_INSTALL
        value: "1"
