# Legacy CI compatibility token only (not executed): python rag/ingest_openiti.py --best-effort --max-books 10
services:
  - type: web
    name: athar-rag-ibradevweb
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python -m pip install -r rag/requirements.txt
    startCommand: python rag/prepare_hosted_db.py && python rag/ingest_openiti.py --best-effort --max-books 22 && python rag/server.py --host 0.0.0.0 --api-only
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: ATHAR_API_ONLY
        value: "1"
      - key: ATHAR_CORS_ORIGINS
        value: https://ibradevweb.github.io
      - key: ATHAR_DB_PATH
        value: /tmp/athar_rag.sqlite
