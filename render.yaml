services:
  - type: web
    name: athar-rag-ibradevweb
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - rag/**
        - render.yaml
      ignoredPaths: []
    buildCommand: python -m pip install -r rag/requirements.txt && python rag/cache_hosted_corpus.py --manifest rag/corpus_release_v3.json --output-dir rag/data/shards
    startCommand: python rag/v5_library_server.py --host 0.0.0.0 --api-only
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: ATHAR_API_ONLY
        value: "1"
      - key: ATHAR_CORS_ORIGINS
        value: https://ibradevweb.github.io
      - key: ATHAR_CORPUS_MODE
        value: sharded
      - key: ATHAR_SHARD_DIR
        value: rag/data/shards
      - key: ATHAR_CORPUS_MANIFEST
        value: rag/corpus_release_v3.json
