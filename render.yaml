services:
  - type: web
    name: athar-rag-ibradevweb
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - rag/**
        - render.yaml
      ignoredPaths: []
    buildCommand: >-
      python -m pip install -r rag/requirements.txt &&
      python rag/cache_hosted_corpus.py --manifest rag/corpus_release_v3.json --output-dir rag/data/shards
    startCommand: python rag/v653_library_server.py --host 0.0.0.0 --api-only
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: ATHAR_PRODUCTION_REVISION
        value: v6.5.4-expanded-evidence
      - key: ATHAR_API_ONLY
        value: "1"
      - key: ATHAR_CORS_ORIGINS
        value: https://ibradevweb.github.io
      - key: ATHAR_CORPUS_MODE
        value: sharded
      - key: ATHAR_SHARD_DIR
        value: rag/data/shards
      - key: ATHAR_CORPUS_MANIFEST
        value: rag/corpus_release_v3.json
      - key: ATHAR_SEMANTIC_URL
        value: https://athar-rag-semantic-ibradevweb.onrender.com
      - key: ATHAR_SEMANTIC_TOKEN
        fromService:
          type: web
          name: athar-rag-semantic-ibradevweb
          envVarKey: ATHAR_SEMANTIC_TOKEN
      - key: ATHAR_SEMANTIC_FAIL_OPEN
        value: "1"
      - key: ATHAR_SEMANTIC_CONNECT_TIMEOUT
        value: "2.0"
      - key: ATHAR_SEMANTIC_READ_TIMEOUT
        value: "8.0"
      - key: ATHAR_SEMANTIC_LIMIT
        value: "40"
      - key: ATHAR_SEMANTIC_OVERSAMPLE
        value: "160"
      - key: ATHAR_QUERY_LLM_ENABLED
        value: "1"
      - key: ATHAR_QUERY_LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: athar-rag-semantic-ibradevweb
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - rag/**
        - render.yaml
      ignoredPaths: []
    buildCommand: >-
      python -m pip install -r rag/requirements-v64.txt &&
      python rag/cache_v653_ann_release.py --corpus-manifest rag/corpus_release_v3.json --output-dir rag/data/v653-ann &&
      python rag/cache_fastembed_model.py --model sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 --cache-dir rag/data/fastembed-cache
    startCommand: >-
      python rag/v653_semantic_server.py --host 0.0.0.0
      --ann-manifest rag/data/v653-ann/athar-v653-sharded.ann.json
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: FASTEMBED_CACHE_PATH
        value: rag/data/fastembed-cache
      - key: ATHAR_FASTEMBED_LOCAL_ONLY
        value: "1"
      - key: ATHAR_ANN_VERIFY_SHA
        value: "0"
      - key: ATHAR_ANN_SHARDED_RELEASE_TAG
        value: rag-ann-v653-sharded-f16-6f8bfac81d61
      - key: ATHAR_SEMANTIC_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: ATHAR_SEMANTIC_TOKEN
        generateValue: true
